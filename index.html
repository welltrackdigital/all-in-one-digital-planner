<style>
/* ================= All-in-One Digital Planner by WellTrack Digital — lavender fields =================
   Palette: #2E0F47 plum · #5A397A violet · #A88FBF lavender · #E8D8F2 mist · #F4EDF9 pearl */
:root{--r:18px;--r-sm:11px;--font-d:'Fraunces',Georgia,'Times New Roman',serif;--font-b:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --rose:#E89AAE;--mint:#8FD0A8;--sky:#9CC3F0;--peach:#F2B98B;--side-w:272px;
  --p1:#2E0F47;--p2:#5A397A;--p3:#A88FBF;--p4:#E8D8F2;--p5:#F4EDF9;
  --pearl:linear-gradient(135deg,#F4EDF9 0%,#E8D8F2 48%,#C2ADD6 100%);--pearl-ink:#2E0F47}
[data-theme="dark"]{--bg0:#1C0830;--bg1:#2E0F47;--bg2:#381A55;--bg3:#2E0F47;--ink:#F4EDF9;--body:#E8D8F2;--muted:#C9B8D8;--faint:#A891BC;
  --line:#46285F;--line2:#5F4F63;--acc:#CDB8E0;--acc2:#A88FBF;--acc-ink:#2E0F47;--lav:#BFA6D4;--card:#2E0F47;--card2:#381A55;--input:#24093A;
  --btn:var(--pearl);--btn-ink:#2E0F47;--btn-sh:rgba(168,143,191,.75);--bar1:#A88FBF;--bar2:#E8D8F2;--barL1:#5A397A;--barL2:#A88FBF;
  --good:#8FD0A8;--bad:#F08BA3;--warn:#F2C177;--shadow:0 18px 40px -20px rgba(0,0,0,.7);--glow:0 0 0 3px rgba(168,143,191,.32);--overlay:rgba(12,3,18,.64)}
[data-theme="light"]{--bg0:#F4EDF9;--bg1:#FFFFFF;--bg2:#FBF7FD;--bg3:#E8D8F2;--ink:#2E0F47;--body:#463852;--muted:#5F4F63;--faint:#7A6987;
  --line:#E8D8F2;--line2:#D3C3E0;--acc:#5A397A;--acc2:#A88FBF;--acc-ink:#F4EDF9;--lav:#5A397A;--card:#FFFFFF;--card2:#FAF6FC;--input:#FFFFFF;
  --btn:linear-gradient(135deg,#6F4E91 0%,#5A397A 45%,#2E0F47 100%);--btn-ink:#F4EDF9;--btn-sh:rgba(90,57,122,.55);--bar1:#5A397A;--bar2:#A88FBF;--barL1:#A88FBF;--barL2:#D6C6E4;
  --good:#2F7A4F;--bad:#B23A5C;--warn:#8E5B12;--shadow:0 16px 38px -24px rgba(46,15,71,.38);--glow:0 0 0 3px rgba(168,143,191,.25);--overlay:rgba(46,15,71,.42)}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{font-family:var(--font-b);font-size:14px;line-height:1.5;color:var(--body);min-height:100vh;
  background:var(--bg0);background:radial-gradient(1100px 520px at 88% -12%,rgba(90,57,122,.42),transparent 62%),radial-gradient(800px 480px at -10% 112%,rgba(168,143,191,.12),transparent 60%),var(--bg0)}
[data-theme="light"] body{background:radial-gradient(1100px 520px at 88% -12%,rgba(168,143,191,.30),transparent 62%),radial-gradient(800px 480px at -10% 112%,rgba(232,216,242,.9),transparent 60%),var(--bg0)}
h1,h2,h3,h4,.disp{font-family:var(--font-d);color:var(--ink);letter-spacing:-.01em;line-height:1.2;font-weight:600}
b,strong{color:var(--ink)}
a{color:var(--acc)}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--input);border:1px solid var(--line2);border-radius:var(--r-sm);padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:var(--glow)}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:80px;line-height:1.5}
::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.gold{color:var(--acc)}
.grow{flex:1;min-width:0}.nowrap{white-space:nowrap}.right{text-align:right}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk{overflow-wrap:anywhere}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50;color:#F4EDF9;display:flex;flex-direction:column;
  background:linear-gradient(185deg,#170624 0%,#2A0E40 52%,#2E0F47 100%);border-right:1px solid rgba(168,143,191,.16);scrollbar-width:thin;scrollbar-color:#5F4F63 transparent}
.sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px 230px at 15% -40px,rgba(168,143,191,.16),transparent 60%),radial-gradient(360px 260px at 115% 35%,rgba(201,160,232,.13),transparent 65%)}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 14px;position:relative}
.brand-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#A88FBF 0%,#5A397A 55%,#2E0F47 100%);display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(168,143,191,.8),inset 0 0 0 1px rgba(245,235,250,.22);flex:none}
.brand-mark img{width:31px;height:auto;display:block}
.brand b{font-family:var(--font-d);font-size:20px;line-height:1.15;font-weight:600;display:block;color:#fff;letter-spacing:.01em}
.brand small{font-size:10.5px;color:#CDB8E0;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.side-search{margin:4px 14px 10px;position:relative;display:flex;align-items:center;gap:8px;width:calc(100% - 28px);padding:9px 12px;border-radius:11px;border:1px solid rgba(201,160,232,.25);background:rgba(255,255,255,.05);color:#CDB8E0;font-size:13px;text-align:left}
.side-search:hover{background:rgba(255,255,255,.09)}
.side-search kbd{margin-left:auto;font-family:inherit;font-size:10.5px;border:1px solid rgba(201,160,232,.3);border-radius:6px;padding:1px 6px;color:#C9B8D8}
.tree{display:flex;flex-direction:column;gap:2px;padding:0 10px 10px;position:relative}
.tcap{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#A88FBF;padding:12px 12px 5px;font-weight:700}
.sec-btn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:11px;background:transparent;color:#E8D8F2;font-size:14px;font-weight:600;text-align:left;position:relative;transition:background .15s}
.sec-btn:hover{background:rgba(209,192,236,.09)}
.sec-btn .sic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none;transition:background .15s}
.sec-btn .sic svg{width:17px;height:17px}
.sec-btn .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-btn .chev{opacity:.6;transition:transform .2s}
.sec-btn .chev svg{width:15px;height:15px}
.sec.open>.sec-btn .chev{transform:rotate(90deg)}
.sec.on>.sec-btn{color:#fff}
.sec.on>.sec-btn .sic{background:var(--pearl);color:#2E0F47}
.sec-btn .cnt{font-size:10.5px;background:rgba(0,0,0,.28);border:1px solid rgba(168,143,191,.32);padding:1px 7px;border-radius:99px;color:#E8D8F2;font-weight:700}
.pages{display:none;flex-direction:column;gap:1px;margin:2px 0 8px 26px;padding-left:14px;border-left:1px solid rgba(201,160,232,.2)}
.sec.open>.pages{display:flex}
.pg-btn{display:flex;align-items:center;gap:9px;padding:7px 10px;border:0;border-radius:9px;background:transparent;color:#D8CAE4;font-size:13px;font-weight:500;text-align:left;position:relative}
.pg-btn svg{width:15px;height:15px;opacity:.75}
.pg-btn:hover{background:rgba(209,192,236,.08);color:#fff}
.pg-btn.on{background:rgba(168,143,191,.14);color:#fff;font-weight:600}

.sbtn{border:1px solid rgba(168,143,191,.28);background:rgba(168,143,191,.09);color:#F4EDF9;border-radius:10px;padding:8px 4px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}

.priv{font-size:11.5px;color:#A88FBF;display:flex;gap:8px;align-items:center;line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:14px clamp(16px,3vw,34px);border-bottom:1px solid var(--line);
  background:var(--bg0);background:var(--card2);background:color-mix(in srgb,var(--bg0) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tbtn.menu-btn{display:none}

.content{padding:22px clamp(16px,3vw,34px) 60px;width:100%;max-width:1480px}

.subtabs button:hover{color:var(--ink);border-color:var(--line2)}
.subtabs button.on{background:var(--btn);color:var(--btn-ink);border-color:transparent;box-shadow:0 8px 18px -10px rgba(168,143,191,.8)}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}

.view{display:none}.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:17px;flex:1;min-width:120px}
.card-h .sub{width:100%;margin-top:-8px;font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.full{grid-column:1/-1}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-size:13.5px;font-weight:600;white-space:nowrap;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-acc{background:var(--btn);border-color:transparent;color:var(--btn-ink);box-shadow:0 8px 18px -10px var(--btn-sh)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--bg3);color:var(--ink);border-color:var(--line)}
.icon-btn svg{width:16px;height:16px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.tag.good{color:var(--good);background:var(--card2);background:color-mix(in srgb,var(--good) 14%,transparent);border-color:var(--line2);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.tag.bad{color:var(--bad);background:var(--card2);background:color-mix(in srgb,var(--bad) 13%,transparent);border-color:var(--line2);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.tag.warn{color:var(--warn);background:var(--card2);background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:var(--line2);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.tag.gold{color:var(--acc);background:var(--card2);background:color-mix(in srgb,var(--acc) 13%,transparent);border-color:var(--line2);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b,.li .t .ti{display:block;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.li .t small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.li.done .t b,.li.done .t .ti{text-decoration:line-through;color:var(--faint)}
.li .acts{display:flex;gap:2px;flex:none}
.amt{font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.pos{color:var(--good)}.amt.neg{color:var(--bad)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);background:transparent;display:grid;place-items:center;flex:none;color:transparent;transition:background .15s,border-color .15s}
.ck svg{width:14px;height:14px;stroke-width:3}
.ck:hover{border-color:var(--acc)}
.ck.on{background:var(--good);border-color:var(--good);color:#1C0830}
.ck.sq{border-radius:7px}
.bar{height:8px;border-radius:99px;background:var(--bg3);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bar1),var(--bar2));transition:width .4s}
.bar.lav>i{background:linear-gradient(90deg,var(--barL1),var(--barL2))}
.bar.good>i{background:linear-gradient(90deg,#4E9E6E,#8FD0A8)}
.bar.over>i{background:linear-gradient(90deg,#C24A6A,#F08BA3)}
.ring{--p:0;--c:var(--acc);width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bg3) 0);position:relative}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--card)}
.ring>div{position:relative;text-align:center;line-height:1.1}
.ring b{font-family:var(--font-d);font-size:26px;display:block}
.ring small{font-size:11px;color:var(--muted)}
.ring.sm{width:74px;height:74px}.ring.sm::before{inset:8px}.ring.sm b{font-size:17px}
.stat{padding:16px 18px}
.stat .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px}
.stat .k svg{width:15px;height:15px;color:var(--acc)}
.stat .v{font-family:var(--font-d);font-size:28px;color:var(--ink);margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:13.5px}
.empty svg{width:30px;height:30px;color:var(--faint);margin-bottom:8px}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;padding:3px;background:var(--card2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--bg3);color:var(--ink);box-shadow:0 1px 0 var(--line2)}
.navig{display:flex;align-items:center;gap:6px}
.navig b{font-family:var(--font-d);font-size:16px;min-width:150px;text-align:center;color:var(--ink)}
.inline-add{display:flex;gap:8px}
.inline-add input{flex:1}
.note-box{background:var(--card2);border:1px dashed var(--line2);border-radius:12px;padding:10px 13px;font-size:13px;color:var(--muted)}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.chipbtn.on{border-color:var(--acc);color:var(--acc);background:var(--card2);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.stars{display:inline-flex;gap:1px;color:var(--acc)}
.stars button{border:0;background:none;font-size:17px;line-height:1;color:var(--faint);padding:0 1px}
.stars button.on{color:var(--acc)}

/* ---------- hero (dashboard) ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:28px 30px;color:#F8F2FB;border:1px solid rgba(168,143,191,.25);
  background:radial-gradient(520px 300px at 92% -10%,rgba(232,216,242,.30),transparent 60%),radial-gradient(420px 320px at -5% 120%,rgba(201,160,232,.32),transparent 62%),linear-gradient(135deg,#5A397A 0%,#2E0F47 52%,#1F0832 100%);
  box-shadow:0 30px 60px -30px rgba(20,5,35,.9)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent,#000 60%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%)}

.hero h2 em{font-style:italic;color:#E8D8F2}

.hero .quote{margin-top:16px;padding:12px 15px;border-left:3px solid #A88FBF;background:rgba(255,255,255,.07);border-radius:0 12px 12px 0;font-family:var(--font-d);font-style:italic;color:#F4EDF9;font-size:15px;max-width:620px}
.hero .quote small{display:block;font-family:var(--font-b);font-style:normal;color:#C9B8D8;font-size:11.5px;margin-top:4px}
.capture{margin-top:18px;display:flex;gap:8px;align-items:stretch;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:6px;max-width:640px}
.capture select{width:auto;flex:none;background:rgba(0,0,0,.25);color:#fff;border:0;border-radius:11px;font-weight:600;padding:9px 10px}
.capture input{background:transparent;border:0;color:#fff;box-shadow:none!important;padding:9px 8px}
.capture input::placeholder{color:#BFA6D4}
.capture .btn{flex:none}
.hero-side{display:flex;flex-direction:column;align-items:center;gap:14px}
.clock{font-family:var(--font-d);font-size:clamp(34px,4vw,52px);color:#fff;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.clock small{font-size:16px;color:#E8D8F2;margin-left:4px}
.dayring{--p:0;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(#E8D8F2 calc(var(--p)*1%),rgba(255,255,255,.12) 0);box-shadow:0 0 40px -8px rgba(232,216,242,.55)}
.dayring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:linear-gradient(160deg,#381A55,#24093A)}
.dayring>div{position:relative;text-align:center}
.dayring b{font-family:var(--font-d);font-size:34px;color:#fff;display:block;line-height:1}
.dayring small{color:#E8D8F2;font-size:11.5px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:6px 11px;font-size:12px;color:#F4EDF9;font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin:18px 0}
.kpi{display:flex;flex-direction:column;gap:4px;padding:15px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;position:relative;overflow:hidden;min-width:0;transition:transform .15s,border-color .15s}
.kpi:hover{transform:translateY(-2px);border-color:var(--acc)}
.kpi .ki{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card2);background:color-mix(in srgb,var(--c,var(--acc)) 18%,transparent);color:var(--c,var(--acc))}
.kpi .ki svg{width:18px;height:18px}
.kpi .kv{font-family:var(--font-d);font-size:24px;color:var(--ink);line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .kl{font-size:11.5px;color:var(--muted);font-weight:600}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;grid-auto-flow:dense}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.prio{display:flex;flex-direction:column;gap:9px}
.prio .pi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:var(--card2);border:1px solid var(--line)}
.prio .pi .num{font-family:var(--font-d);color:var(--acc);font-size:18px;width:20px;text-align:center}
.prio .pi input{border:0;background:transparent;padding:4px 0;box-shadow:none!important}
.prio .pi.done input{text-decoration:line-through;color:var(--faint)}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:6px 0 10px}
.tl-i::before{content:"";position:absolute;left:-17px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--acc));box-shadow:0 0 0 3px var(--card)}

.tl-i.now .tm::after{content:" · now";color:var(--good)}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);border-radius:13px;padding:9px 4px;text-align:center;background:var(--card2);min-width:0}

.hbtn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:600;color:var(--ink);min-width:0}
.hbtn .ck{width:20px;height:20px}
.hbtn.on{border-color:var(--line2);border-color:color-mix(in srgb,var(--good) 50%,transparent);background:var(--card2);background:color-mix(in srgb,var(--good) 12%,var(--card2))}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.timer .tv{font-family:var(--font-d);font-size:40px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.water{display:flex;gap:5px;flex-wrap:wrap}

.moods{display:flex;gap:6px;flex-wrap:wrap}

.moods button.on{border-color:var(--acc);background:var(--card2);background:color-mix(in srgb,var(--acc) 16%,var(--card2));transform:scale(1.06)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .ch{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:4px 0}

.cal .more{font-size:10.5px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.weekcols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wcol{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:10px;min-height:260px;display:flex;flex-direction:column;gap:6px;min-width:0}

.wcol h4 small{font-family:var(--font-b);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.witem{font-size:12.5px;padding:6px 8px;border-radius:9px;background:var(--card2);border:1px solid var(--line);display:flex;gap:6px;align-items:flex-start;color:var(--ink);overflow-wrap:anywhere;text-align:left;width:100%}
.witem .ck{width:18px;height:18px}
.witem.done{color:var(--faint);text-decoration:line-through}
.witem.ev{border-left:3px solid var(--c,var(--lav))}
.wadd{margin-top:auto;border:1px dashed var(--line2);background:transparent;border-radius:9px;padding:6px;font-size:12px;color:var(--muted);font-weight:600}
.yeargrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mini{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px;min-width:0}
.mini h4{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between}
.mini .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini .mg span{font-size:10.5px;padding:3px 0;border-radius:6px;color:var(--body)}
.mini .mg .h{color:var(--faint);font-weight:700}
.mini .mg .has{background:var(--card2);background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--ink);font-weight:700}
.mini .mg .td{outline:1.5px solid var(--acc)}
.mini .mg button{border:0;background:none;font:inherit;font-size:10.5px;padding:3px 0;border-radius:6px;color:inherit}
.blocks{display:flex;flex-direction:column}
.hour{display:grid;grid-template-columns:62px minmax(0,1fr);border-bottom:1px solid var(--line);min-height:44px}
.hour .hl{font-size:11.5px;color:var(--muted);font-weight:700;padding:6px 8px 0 0;text-align:right}
.hour .hb{padding:4px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.hour .hb button.addh{opacity:0;border:0;background:transparent;color:var(--faint);font-size:12px;text-align:left;padding:4px;min-height:30px}
.hour:hover .hb button.addh{opacity:1}
.blk{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--card2);background:color-mix(in srgb,var(--c,var(--lav)) 22%,var(--card2));border-left:4px solid var(--c,var(--lav));font-size:13px;color:var(--ink);text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0}
.blk small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.hour.now .hl{color:var(--acc)}

/* ---------- work ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px;min-height:300px;display:flex;flex-direction:column;gap:9px}
.col.drag{border-color:var(--acc);background:var(--card2);background:color-mix(in srgb,var(--acc) 8%,var(--card2))}
.col h4{font-family:var(--font-b);font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--muted)}
.col h4 .tag{margin-left:auto}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;cursor:grab;box-shadow:0 6px 14px -12px rgba(0,0,0,.6)}
.kcard:active{cursor:grabbing}
.kcard b{display:block;color:var(--ink);font-size:13.5px;overflow-wrap:anywhere}
.kcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.kcard .mv{display:flex;gap:4px;margin-top:8px}
.pri-high{color:var(--bad)}.pri-med{color:var(--warn)}.pri-low{color:var(--good)}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.quad{border-radius:18px;padding:14px;border:1px solid var(--line);background:var(--card);min-height:220px;display:flex;flex-direction:column;gap:6px}
.quad h4{font-size:16px;display:flex;align-items:center;gap:8px}
.quad h4 small{font-family:var(--font-b);font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-left:auto}
.quad.q1{border-top:4px solid var(--bad)}.quad.q2{border-top:4px solid var(--acc)}.quad.q3{border-top:4px solid var(--sky)}.quad.q4{border-top:4px solid var(--faint)}
.gantt{min-width:720px}
.g-head{display:grid;grid-template-columns:200px 1fr;font-size:11px;color:var(--muted);font-weight:700}
.g-row{display:grid;grid-template-columns:200px 1fr;align-items:center;border-top:1px solid var(--line);min-height:44px}
.g-row .gn{padding:8px 10px 8px 0;font-size:13px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-track{position:relative;height:44px}
.g-bar{position:absolute;top:10px;height:24px;border-radius:8px;background:var(--c,var(--acc));opacity:.9;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#2E0F47;white-space:nowrap;overflow:hidden;min-width:6px}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.8}
.g-scale{position:relative;height:22px}
.g-scale span{position:absolute;top:2px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.projcard{cursor:pointer;transition:transform .15s,border-color .15s;text-align:left;width:100%}
.projcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.projcard .pc-top{display:flex;align-items:center;gap:10px}
.projcard .sw{width:12px;height:36px;border-radius:6px;flex:none}

/* ---------- notes ---------- */
.nb{display:grid;grid-template-columns:220px 280px minmax(0,1fr);gap:0;min-height:620px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.nb-col{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--card2)}
.nb-col:last-child{border-right:0;background:var(--card)}
.nb-col .nh{display:flex;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid var(--line)}
.nb-col .nh h4{font-family:var(--font-b);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);flex:1}
.nb-list{overflow-y:auto;flex:1;padding:6px}
.nbi{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:10px;border:0;background:transparent;text-align:left;color:var(--body);font-size:13.5px;font-weight:600;min-width:0}
.nbi:hover{background:var(--bg3)}
.nbi.on{background:var(--card2);background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--ink)}
.nbi .tab{width:6px;height:22px;border-radius:3px;flex:none}
.nbi .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.pgi{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:11px;border:1px solid transparent;background:transparent;margin-bottom:3px;min-width:0}
.pgi:hover{background:var(--bg3)}
.pgi.on{background:var(--card);border-color:var(--line2);box-shadow:var(--shadow)}
.pgi b{display:block;color:var(--ink);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgi small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.ed-wrap{display:flex;flex-direction:column;min-height:0;flex:1}
.ed-title{font-family:var(--font-d);font-size:26px;font-weight:600;color:var(--ink);border:0;background:transparent;padding:16px 20px 4px;box-shadow:none!important}
.ed-meta{padding:0 20px 8px;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ed-tools{display:flex;gap:3px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card2)}
.ed-tools button{min-width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 7px}
.ed-tools button:hover{background:var(--bg3);color:var(--ink);border-color:var(--line)}
.ed-tools .sep{width:1px;background:var(--line);margin:4px 3px}
.editor{flex:1;padding:16px 20px 30px;outline:none;color:var(--body);font-size:14.5px;line-height:1.7;overflow-wrap:anywhere;min-height:300px}
.editor:empty::before{content:attr(data-ph);color:var(--faint)}
.editor h2{font-size:22px;margin:12px 0 6px}.editor h3{font-size:18px;margin:10px 0 4px}
.editor ul,.editor ol{padding-left:24px;margin:6px 0}
.editor blockquote{border-left:3px solid var(--acc);padding:4px 12px;margin:8px 0;color:var(--muted);font-style:italic}
.editor mark{background:var(--card2);background:color-mix(in srgb,var(--acc) 35%,transparent);color:var(--ink);padding:0 2px;border-radius:3px}
.editor ul.todo{list-style:none;padding-left:4px}
.editor ul.todo li{position:relative;padding-left:28px;margin:4px 0}
.editor ul.todo li::before{content:"";position:absolute;left:0;top:4px;width:17px;height:17px;border-radius:5px;border:2px solid var(--line2);cursor:pointer}
.editor ul.todo li.done{color:var(--faint);text-decoration:line-through}
.editor ul.todo li.done::before{background:var(--good);border-color:var(--good)}
.editor a{color:var(--acc)}
.nb-back{display:none}
@media(max-width:1080px){.nb-back{display:inline-flex}}
.journal-date{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prompt{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--card2)),var(--card2));border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--font-d);font-style:italic;color:var(--ink);font-size:15.5px}
.qnotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sticky{border-radius:16px;padding:14px;min-height:130px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--card2);position:relative;overflow-wrap:anywhere}
.sticky p{flex:1;color:var(--ink);white-space:pre-wrap;font-size:13.5px}
.sticky small{color:var(--muted);font-size:11px}
.sticky .acts{position:absolute;top:6px;right:6px;display:flex}

/* ---------- finance & wellness ---------- */
.chart{width:100%;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-b)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbars .hr{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbars .hr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:600}
.hbars .bar{margin:0}
.cols{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.cols .cc{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;height:100%;justify-content:flex-end}
.cols .cc i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--bar2),var(--bar1));min-height:3px}
.cols .cc i.lav{background:linear-gradient(180deg,var(--barL2),var(--barL1))}
.cols .cc i.rose{background:linear-gradient(180deg,#F5B3C3,#D9708C)}
.cols .cc i.sky{background:linear-gradient(180deg,#B8D6F7,#6FA3DE)}
.cols .cc small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.cols .cc b{font-size:10.5px;color:var(--ink);white-space:nowrap}
.pair{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;height:100%}
.pair i{max-width:16px!important}
.hgrid{border-collapse:separate;border-spacing:3px;font-size:12px}
.hgrid th{font-size:10px;color:var(--muted);font-weight:700;padding:2px;min-width:22px}
.hgrid td.hn{padding-right:10px;color:var(--ink);font-weight:600;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.hcell{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--card2);display:block;padding:0}
.hcell.on{background:var(--c,var(--good));border-color:transparent}
.hcell.td{outline:2px solid var(--acc);outline-offset:1px}
.hcell.fut{opacity:.35}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.heat span{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--muted);min-width:0}
.heat .m1{background:#5F4F63;color:#F4EDF9}.heat .m2{background:#5A397A;color:#F4EDF9}.heat .m3{background:#A88FBF;color:#fff}.heat .m4{background:#CDB8E0;color:#2E0F47}.heat .m5{background:#F4EDF9;color:#2E0F47}
[data-theme="light"] .heat .m1{background:#E8D8F2;color:#2E0F47}[data-theme="light"] .heat .m2{background:#CDB8E0;color:#2E0F47}[data-theme="light"] .heat .m3{background:#A88FBF;color:#fff}[data-theme="light"] .heat .m4{background:#5A397A;color:#F4EDF9}[data-theme="light"] .heat .m5{background:#2E0F47;color:#F4EDF9}
.about{display:flex;gap:16px;align-items:center}.about img{width:96px;height:96px;border-radius:22px;flex:none;box-shadow:0 14px 30px -14px rgba(46,15,71,.8)}.about h3{margin-bottom:4px}
.heat .x{visibility:hidden}
.book{display:flex;gap:12px}
.cover{width:54px;height:76px;border-radius:6px 10px 10px 6px;flex:none;display:grid;place-items:center;font-family:var(--font-d);font-size:22px;color:#fff;box-shadow:inset 4px 0 0 rgba(0,0,0,.2)}
.count{font-family:var(--font-d);font-size:30px;color:var(--acc);line-height:1}

/* ---------- modal, toast, search ---------- */
.mback{position:fixed;inset:0;z-index:200;background:var(--overlay);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px}
.mback.on{display:flex}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--line2);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.45);animation:pop .18s ease}
.modal.wide{width:min(760px,100%)}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.modal header{display:flex;align-items:center;gap:10px;padding:18px 20px 10px}
.modal header h3{flex:1;font-size:20px}
.mbody{padding:6px 20px 14px;overflow-y:auto}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.fld.half{grid-column:span 1}
.fld label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fld .hint{font-size:11.5px;color:var(--faint)}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--bad)}
.fld .em{font-size:12px;color:var(--bad);font-weight:600}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);font-weight:500;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc2)}
.colors{display:flex;gap:7px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.colors button.on{border-color:var(--ink)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 28px)}
.toast{background:var(--ink);color:var(--bg0);padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.35);animation:pop .2s ease}
.toast svg{color:var(--acc)}
.pal{width:min(620px,100%);background:var(--bg1);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.45);overflow:hidden;align-self:flex-start;margin-top:8vh}
.pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:17px 20px;font-size:16px;box-shadow:none!important}
.pal .res{max-height:60vh;overflow-y:auto;padding:8px}
.pal .ri{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:11px;text-align:left;color:var(--body);min-width:0}
.pal .ri.on,.pal .ri:hover{background:var(--bg3);color:var(--ink)}
.pal .ri small{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.pal .ri span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .grp{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:10px 12px 4px}
.bottomnav{display:none}
.scrim{display:none}

/* ---------- responsive ---------- */
@media(max-width:1380px){.yeargrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1280px){.dash .c3,.dash .c4{grid-column:span 6}.dash .c5,.dash .c7{grid-column:span 6}.dash .c8{grid-column:span 12}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .weekcols{grid-template-columns:repeat(4,minmax(0,1fr))}.nb{grid-template-columns:200px 240px minmax(0,1fr)}}
@media(max-width:1120px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1080px){
  .app{grid-template-columns:minmax(0,1fr)}

  .tbtn.menu-btn{display:grid}

  .hero-grid{grid-template-columns:minmax(0,1fr)}

  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nb{grid-template-columns:200px minmax(0,1fr)}
  .nb .nb-col.pgs{display:none}
  .nb.show-pages .nb-col.pgs{display:flex}.nb.show-pages .nb-col.eds{display:none}
}
@media(max-width:820px){
  .content{padding:16px 14px 104px}
  .topbar{padding:10px 14px;gap:8px}
  .topbar h1{font-size:19px}
  .hide-m{display:none!important}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .dash{grid-template-columns:minmax(0,1fr)}
  .dash>*{grid-column:1/-1!important}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .g4.sts,.g3.sts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .sts .stat{padding:13px 14px}
  .span2,.span3{grid-column:auto}
  .weekcols{grid-template-columns:minmax(0,1fr);}
  .wcol{min-height:0}
  .yeargrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal{gap:3px}
  .cal .cd{min-height:64px;padding:4px;border-radius:9px}
  .cal .ev{font-size:0;padding:0;height:5px;border-left:0;background:var(--c,var(--lav))}
  .cal .more{display:none}
  .matrix{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:repeat(4,minmax(230px,82vw))}
  .nb{grid-template-columns:minmax(0,1fr);min-height:0}
  .nb .nb-col{border-right:0}
  .nb .nb-col.nbs{display:none}
  .nb.show-books .nb-col.nbs{display:flex}.nb.show-books .nb-col.pgs,.nb.show-books .nb-col.eds{display:none}
  .nb.show-pages .nb-col.pgs{display:flex}
  .page-head h2{font-size:25px}
  .hero{padding:22px 18px;border-radius:22px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:linear-gradient(180deg,#2E0F47,#1A0729);border-top:1px solid rgba(168,143,191,.2);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottomnav button{flex:1;border:0;background:transparent;color:#D8CAE4;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:5px 2px;border-radius:12px;min-width:0}
  .bottomnav button.on{color:#fff;background:rgba(168,143,191,.14)}
  .bottomnav button.add{color:#2E0F47}

  #toasts{bottom:88px}
  .hgrid-wrap{overflow-x:auto}
  .tbl.stack-m thead{display:none}
  .tbl.stack-m tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tbl.stack-m td{border:0;padding:0 4px}
}
@media(max-width:480px){

    case 'monthly':{const day=Math.min(a.getDate(),dim(b.getFullYear(),b.getMonth()+1));return b.getDate()===day}

    {k:'notes',l:'Notes',t:'textarea',rows:3}],

  fields:()=>[{k:'title',l:'Event',req:true,ph:'e.g. Dentist, Team call, Sara’s party'},{k:'date',l:'Date',t:'date',req:true,half:true},{k:'repeat',l:'Repeats',t:'select',half:true,opts:[['none','Does not repeat'],['daily','Every day'],['weekly','Every week'],['monthly','Every month'],['yearly','Every year']]},
    {k:'time',l:'Start time',t:'time',half:true,hint:'Leave empty for all-day'},{k:'end',l:'End time',t:'time',half:true},{k:'location',l:'Location',half:true},{k:'cat',l:'Category',t:'select',half:true,opts:CATS},
    {k:'until',l:'Repeat until (optional)',t:'date',half:true},{k:'notes',l:'Notes',t:'textarea',rows:2}],
  check:v=>v.end&&v.time&&v.end<=v.time?'End time must be after the start time':(v.until&&v.until<v.date?'“Repeat until” must be after the date':null)};
SCH.block={c:'timeblocks',name:'time block',label:'title',def:()=>({date:curDay(),start:'09:00',end:'10:00',title:'',color:COLORS[1]}),

/* ---------------- TODAY (daily planner) ---------------- */
PAGES['planner/today']=()=>{const d=curDay(),it=dayItems(d),rec=dayRec(d),td=today(),nowH=new Date().getHours();
  const timed=[...it.ev.filter(e=>e.time).map(e=>({t:e.time,end:e.end,title:e.title,c:catColor(e.cat),type:'event',id:e.id,sub:e.location})),...it.blocks.map(b=>({t:b.start,end:b.end,title:b.title,c:b.color,type:'block',id:b.id})),...it.tasks.filter(t=>t.time).map(t=>({t:t.time,title:t.title,c:'#E89AAE',type:'task',id:t.id,done:t.status==='done'}))];
  let hours='';for(let h=6;h<=23;h++){const hh=pad(h),list=timed.filter(x=>x.t.slice(0,2)===hh);
    hours+=`<div class="hour ${d===td&&h===nowH?'now':''}"><div class="hl">${fTime(hh+':00')}</div><div class="hb">${list.map(x=>`<button type="button" class="blk" style="--c:${x.c}" data-a="edit" data-t="${x.type}" data-id="${x.id}"><span class="grow ellip" style="${x.done?'text-decoration:line-through;opacity:.6':''}">${esc(x.title)}</span><small>${fTime(x.t)}${x.end?' – '+fTime(x.end):''}</small></button>`).join('')}<button type="button" class="addh" data-a="add" data-t="block" data-pdate="${d}" data-pstart="${hh}:00" data-pend="${pad(Math.min(23,h+1))}:00">+ Plan ${fTime(hh+':00')}</button></div></div>`}
  const early=timed.filter(x=>+x.t.slice(0,2)<6);
  const allday=it.ev.filter(e=>!e.time);const doneT=it.tasks.filter(t=>t.status==='done').length;
  const w=num(S.water[d]),mood=S.mood[d];
  return head('Daily planner',esc(fLong(d)),d===td?'One page for today — priorities, schedule, tasks and notes.':(d<td?`${plural(Math.abs(until(d)),'day')} ago`:`In ${plural(until(d),'day')}`),
    `<div class="row wrap">${navig('dayShift',fShort(d))}${d!==td?`<button type="button" class="btn btn-sm" data-a="dayToday">Today</button>`:''}<button type="button" class="btn btn-acc btn-sm" data-a="add" data-t="event" data-pdate="${d}">${ic('plus')}Event</button></div>`)+
  `<div class="dash">
   <div class="c7 stack">
    <section class="card"><div class="card-h"><h3>Schedule</h3><button type="button" class="btn btn-sm" data-a="add" data-t="block" data-pdate="${d}">${ic('plus')}Time block</button></div>
      ${allday.length||it.bills.length||it.dates.length?`<div class="pillrow" style="margin-bottom:10px">${allday.map(e=>`<button type="button" class="tag" style="border-left:3px solid ${catColor(e.cat)}" data-a="edit" data-t="event" data-id="${e.id}">${esc(e.title)} · all day</button>`).join('')}${it.bills.map(b=>`<span class="tag bad">${ic('receipt',12)}${esc(b.name)} · ${money(b.amount)}</span>`).join('')}${it.dates.map(x=>`<span class="tag gold">${ic('gift',12)}${esc(x.name)}</span>`).join('')}</div>`:''}
      ${early.length?`<div class="pillrow" style="margin-bottom:8px">${early.map(x=>`<button type="button" class="tag" data-a="edit" data-t="${x.type}" data-id="${x.id}">${fTime(x.t)} · ${esc(x.title)}</button>`).join('')}</div>`:''}
      <div class="blocks">${hours}</div></section>
   </div>
   <div class="c5 stack">
    <section class="card"><div class="card-h"><h3>Top 3 priorities</h3><span class="tag gold">${rec.done.filter(Boolean).length}/3</span></div>
      <div class="prio">${[0,1,2].map(i=>`<div class="pi ${rec.done[i]?'done':''}"><span class="num">${i+1}</span><input data-top="${i}" data-d="${d}" maxlength="120" value="${esc(rec.top3[i]||'')}" placeholder="${['The one thing that matters most','Second priority','Third priority'][i]}" aria-label="Priority ${i+1}">${ck(rec.done[i],'topDone',`data-i="${i}" data-d="${d}"`)}</div>`).join('')}</div></section>
    <section class="card"><div class="card-h"><h3>Tasks</h3><span class="tag">${doneT}/${it.tasks.length} done</span><button type="button" class="btn btn-sm" data-a="add" data-t="task" data-pdue="${d}">${ic('plus')}Task</button></div>
      <form class="inline-add" data-form="quickTask" data-d="${d}"><input name="t" placeholder="Add a task for this day and press Enter" maxlength="200" aria-label="New task"><button class="btn btn-sm" type="submit">${ic('plus')}</button></form>
      <div class="list" style="margin-top:6px">${it.tasks.map(t=>taskLi(t,true)).join('')||empty('No tasks for this day','Add one above — small steps count.','check')}</div></section>
    <section class="card"><div class="card-h"><h3>Notes for the day</h3><span class="tiny faint" id="dayNoteSt"></span></div>
      <textarea data-daynote="${d}" rows="5" placeholder="Thoughts, reminders, wins…" aria-label="Notes for the day">${esc(rec.notes||'')}</textarea></section>
    <section class="card"><div class="card-h"><h3>Check-in</h3><button type="button" class="btn btn-sm btn-ghost" data-a="pg" data-s="wellness" data-p="mood">More</button></div>
      <div class="small muted" style="margin-bottom:6px">Mood</div>${moodPicker(d,mood)}
      <div class="small muted" style="margin:12px 0 6px">Water · ${w}/${S.settings.waterGoal}</div><div class="row">${waterGlasses(d)}</div></section>
   </div></div>`};
AFTER['planner/today']=()=>{bindTop();bindDayNote()};
function bindTop(){$$('[data-top]').forEach(inp=>inp.addEventListener('input',()=>{const r=dayRec(inp.dataset.d);r.top3[+inp.dataset.top]=inp.value.slice(0,120);S.sample=false;saveSoon()}))}

A.topDone=el=>{const r=dayRec(el.dataset.d),i=+el.dataset.i;r.done[i]=!r.done[i];save();render()};
A.dayShift=el=>{S.ui.day=addD(curDay(),+el.dataset.d);saveSoon();render()};
A.dayToday=()=>{S.ui.day=today();render()};

document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f)});
const FORMS={};
FORMS.quickTask=f=>{const v=f.t.value.trim();if(!v){f.t.focus();return}S.tasks.unshift({id:uid(),title:v.slice(0,200),notes:'',due:f.dataset.d||'',time:'',priority:'med',status:'todo',projectId:f.dataset.p||'',matrix:'',created:Date.now()});commit('Task added');setTimeout(()=>{const n=$(`[data-form="quickTask"] input`);n&&n.focus()},20)};

  return `<div class="li ${t.status==='done'?'done':''}">${ck(t.status==='done','taskDone',`data-id="${t.id}"`)}<div class="t"><b>${esc(t.title)}</b><small>${[t.due&&!compact?`<span class="${od?'bad':''}">${od?'Overdue · ':''}${fShort(t.due)}</span>`:'',t.time?fTime(t.time):'',p?`<span style="color:${esc(p.color)}">● ${esc(p.name)}</span>`:'',`<span class="pri-${t.priority}">${{high:'High',med:'Medium',low:'Low'}[t.priority]}</span>`].filter(Boolean).join(' · ')}</small></div>${acts('task',t.id)}</div>`}
A.taskDone=el=>{const t=S.tasks.find(x=>x.id===el.dataset.id);if(!t)return;t.status=t.status==='done'?'todo':'done';t.doneAt=t.status==='done'?today():'';save();render();if(t.status==='done')toast('Nice — task done!')};
const MOODS=[['😞','Low'],['😕','Meh'],['🙂','Okay'],['😊','Good'],['🤩','Great']];

/* ---------------- WEEK ---------------- */

const weekRec=k=>{S.weeks[k]=S.weeks[k]||{goals:[],review:{wins:'',learn:'',next:''}};const r=S.weeks[k];if(!Array.isArray(r.goals))r.goals=[];r.review={wins:'',learn:'',next:'',...(r.review||{})};return r};
PAGES['planner/week']=()=>{const w=curWeek(),days=weekDays(w),td=today(),rec=weekRec(w);
  const label=`${fDay(days[0])} – ${fDay(days[6])}`;
  return head('Weekly planner',`Week of ${esc(fDay(w))}`,'Plan the whole week at a glance. Click a day to open its daily page.',`<div class="row wrap">${navig('weekShift',label)}<button type="button" class="btn btn-sm" data-a="weekToday">This week</button></div>`)+
  `<div class="weekcols">${days.map(d=>{const it=dayItems(d);return `<div class="wcol ${d===td?'today':''}"><h4><button type="button" style="all:unset;cursor:pointer" data-a="openDay" data-d="${d}">${esc(fD(d,{weekday:'short'}))}</button><small>${esc(fDay(d))}</small></h4>
     ${it.ev.map(e=>`<button type="button" class="witem ev" style="--c:${catColor(e.cat)}" data-a="edit" data-t="event" data-id="${e.id}">${e.time?`<b style="font-size:11px">${fTime(e.time)}</b> `:''}${esc(e.title)}</button>`).join('')}
     ${it.bills.map(b=>`<div class="witem" style="border-left:3px solid var(--rose)">${ic('receipt',13)}${esc(b.name)}</div>`).join('')}
     ${it.dates.map(x=>`<div class="witem" style="border-left:3px solid var(--acc)">${ic('gift',13)}${esc(x.name)}</div>`).join('')}
     ${it.tasks.map(t=>`<div class="witem ${t.status==='done'?'done':''}">${ck(t.status==='done','taskDone',`data-id="${t.id}"`)}<span class="grow" data-a="edit" data-t="task" data-id="${t.id}" style="cursor:pointer">${esc(t.title)}</span></div>`).join('')}
     <button type="button" class="wadd" data-a="add" data-t="task" data-pdue="${d}">+ Task</button></div>`}).join('')}</div>
  <div class="grid g2" style="margin-top:16px">
   <section class="card"><div class="card-h"><h3>Weekly goals</h3><span class="tag gold">${rec.goals.filter(g=>g.done).length}/${rec.goals.length}</span></div>
     <form class="inline-add" data-form="weekGoal" data-w="${w}"><input name="t" maxlength="140" placeholder="Add a goal for this week" aria-label="New weekly goal"><button class="btn btn-sm" type="submit">${ic('plus')}</button></form>
     <div class="list" style="margin-top:6px">${rec.goals.map(g=>`<div class="li ${g.done?'done':''}">${ck(g.done,'wgDone',`data-w="${w}" data-id="${g.id}"`)}<div class="t"><span class="ti">${esc(g.text)}</span></div><button type="button" class="icon-btn" data-a="wgDel" data-w="${w}" data-id="${g.id}" aria-label="Delete">${ic('trash')}</button></div>`).join('')||empty('No goals yet','Two or three is plenty.','target')}</div></section>

     ${[['wins','Wins this week','What went well?'],['learn','Lessons','What would you do differently?'],['next','Focus next week','One thing to focus on…']].map(([k,l,ph])=>`<div class="fld" style="margin-bottom:10px"><label>${l}</label><textarea rows="2" data-rev="${k}" data-w="${w}" placeholder="${ph}">${esc(rec.review[k])}</textarea></div>`).join('')}</section></div>`};
AFTER['planner/week']=()=>$$('[data-rev]').forEach(t=>t.addEventListener('input',()=>{weekRec(t.dataset.w).review[t.dataset.rev]=t.value.slice(0,2000);S.sample=false;saveSoon();const st=$('#revSt');if(st)st.textContent='Saved'}));

A.weekToday=()=>{S.ui.week=today();render()};

/* ---------------- MONTH ---------------- */
const curYm=k=>isYm(S.ui[k])?S.ui[k]:ymOf(today());
PAGES['planner/month']=()=>{const k=curYm('calYm'),[y,m]=k.split('-').map(Number),first=`${k}-01`,start=weekStartOf(first),td=today();

/* ---------------- YEAR ---------------- */
PAGES['planner/year']=()=>{const y=num(S.ui.year)||+today().slice(0,4),td=today();const goals=(S.yearGoals[y]=Array.isArray(S.yearGoals[y])?S.yearGoals[y]:[]);

  const doneY=S.tasks.filter(t=>t.status==='done'&&String(t.doneAt||'').startsWith(String(y))).length;

   <div class="c8"><div class="yeargrid">${Array.from({length:12},(_,i)=>mini(i+1)).join('')}</div></div></div>`};
A.yearShift=el=>{S.ui.year=(num(S.ui.year)||+today().slice(0,4))+ +el.dataset.d;saveSoon();render()};
A.monOpen=el=>{S.ui.calYm=el.dataset.k;go('planner','month')};
FORMS.yearGoal=f=>{const v=f.t.value.trim();if(!v){f.t.focus();return}const y=f.dataset.y;S.yearGoals[y]=Array.isArray(S.yearGoals[y])?S.yearGoals[y]:[];S.yearGoals[y].push({id:uid(),text:v.slice(0,140),done:false});commit('Goal added')};

A.ygDel=el=>{S.yearGoals[el.dataset.y]=(S.yearGoals[el.dataset.y]||[]).filter(x=>x.id!==el.dataset.id);commit('Goal removed')};

/* ---------------- EVENTS ---------------- */
function upcoming(days=60){const td=today(),out=[];for(let i=0;i<days;i++){const d=addD(td,i);eventsOn(d).forEach(e=>out.push({d,e}))}return out}
PAGES['planner/events']=()=>{const up=upcoming(90),td=today(),past=S.events.filter(e=>(!e.repeat||e.repeat==='none')&&e.date<td).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  let g='';const rows=up.map(({d,e})=>{const h=d!==g?`<div class="tcap" style="color:var(--acc);padding:14px 2px 4px">${d===td?'Today':d===addD(td,1)?'Tomorrow':esc(fShort(d))}</div>`:'';g=d;
    return h+`<div class="li"><span class="dot" style="background:${catColor(e.cat)}"></span><div class="t"><b>${esc(e.title)}</b><small>${[e.time?fTime(e.time)+(e.end?' – '+fTime(e.end):''):'All day',e.location?esc(e.location):'',e.repeat&&e.repeat!=='none'?'Repeats '+{daily:'daily',weekly:'weekly',monthly:'monthly',yearly:'yearly'}[e.repeat]:''].filter(Boolean).join(' · ')}</small></div>${acts('event',e.id)}</div>`}).join('');
  return head('Events','Upcoming events','The next 90 days, including repeating events.',`<button type="button" class="btn btn-acc" data-a="add" data-t="event">${ic('plus')}New event</button>`)+
  `<div class="dash"><section class="card c8"><div class="card-h"><h3>Coming up</h3><span class="tag">${up.length}</span></div>${rows||empty('Nothing planned yet','Add birthdays, appointments, trips, calls…','bell')}</section>
   <section class="card c4"><div class="card-h"><h3>Past events</h3></div><div class="list">${past.map(e=>`<div class="li"><span class="dot" style="background:${catColor(e.cat)}"></span><div class="t"><b>${esc(e.title)}</b><small>${esc(fShort(e.date))}</small></div>${acts('event',e.id)}</div>`).join('')||empty('No past events','')}</div></section></div>`};

/* ================= TASKS & PROJECTS ================= */
SCH.project={c:'projects',name:'project',def:()=>({name:'',desc:'',color:COLORS[0],start:today(),end:addD(today(),30),status:'active'}),
  fields:()=>[{k:'name',l:'Project name',req:true,max:80},{k:'desc',l:'Description',t:'textarea',rows:2},{k:'start',l:'Start',t:'date',half:true},{k:'end',l:'Finish by',t:'date',half:true},
    {k:'status',l:'Status',t:'select',half:true,opts:[['active','Active'],['paused','Paused'],['done','Completed']]},{k:'color',l:'Colour',t:'color'}],
  check:v=>v.start&&v.end&&v.end<v.start?'The finish date must be after the start':null,
  delNote:'Its tasks stay in your task list (without a project).',
  onDel:id=>{S.tasks.forEach(t=>{if(t.projectId===id)t.projectId=''});S.goals.forEach(g=>{if(g.projectId===id)g.projectId=''});S.meetings.forEach(m=>{if(m.projectId===id)m.projectId=''});if(S.ui.proj===id)S.ui.proj=null}};
SCH.goal={c:'goals',name:'goal',label:'title',def:()=>({title:'',area:'Personal',why:'',deadline:'',target:'',current:0,unit:'',projectId:'',done:false,milestones:[]}),
  fields:()=>[{k:'title',l:'Goal',req:true,max:120,ph:'e.g. Run a 5k, Save for a trip'},{k:'area',l:'Life area',t:'select',half:true,opts:['Personal','Health','Money','Career','Learning','Relationships','Home','Fun']},{k:'deadline',l:'Target date',t:'date',half:true},
    {k:'current',l:'Progress so far',t:'num',half:true,min:0,hint:'Optional — e.g. 2'},{k:'target',l:'Target number',t:'num',half:true,min:0,hint:'Optional — e.g. 5'},{k:'unit',l:'Unit',half:true,max:20,ph:'km, books, $…'},
    {k:'projectId',l:'Project',t:'select',half:true,opts:()=>[['','No project'],...S.projects.map(p=>[p.id,p.name])]},{k:'why',l:'Why it matters',t:'textarea',rows:2}],
  prep:v=>{v.current=num(v.current,0);v.target=v.target===''?'':num(v.target,0)}};
SCH.meeting={c:'meetings',name:'meeting',label:'title',def:()=>({title:'',date:today(),time:'',projectId:'',attendees:'',notes:'',actions:[]}),
  fields:()=>[{k:'title',l:'Meeting',req:true,max:100},{k:'date',l:'Date',t:'date',req:true,half:true},{k:'time',l:'Time',t:'time',half:true},
    {k:'projectId',l:'Project',t:'select',half:true,opts:()=>[['','No project'],...S.projects.map(p=>[p.id,p.name])]},{k:'attendees',l:'Attendees',half:true,max:200},{k:'notes',l:'Notes',t:'textarea',rows:5}]};
const projOf=id=>S.projects.find(p=>p.id===id);
const projStats=p=>{const ts=S.tasks.filter(t=>t.projectId===p.id),d=ts.filter(t=>t.status==='done').length;return {total:ts.length,done:d,p:pct(d,ts.length)}};
const goalPct=g=>g.done?100:(num(g.target)>0?pct(num(g.current),num(g.target)):(g.milestones&&g.milestones.length?pct(g.milestones.filter(m=>m.done).length,g.milestones.length):0));

/* ---------------- ALL TASKS ---------------- */
PAGES['work/tasks']=()=>{const td=today(),f=S.ui.taskf||'open',pf=S.ui.taskp||'',q=(S.ui.taskq||'').toLowerCase();
  let list=S.tasks.filter(t=>(!pf||t.projectId===pf)&&(!q||t.title.toLowerCase().includes(q)||String(t.notes||'').toLowerCase().includes(q)));
  const open=list.filter(t=>t.status!=='done'),wk=addD(td,7);
  const F={open,today:open.filter(t=>t.due===td),upcoming:open.filter(t=>t.due>td),overdue:open.filter(t=>t.due&&t.due<td),done:list.filter(t=>t.status==='done'),all:list};
  const sel=(F[f]||open).slice().sort((a,b)=>(a.status==='done')-(b.status==='done')||(a.due||'9999').localeCompare(b.due||'9999')||({high:0,med:1,low:2}[a.priority]-{high:0,med:1,low:2}[b.priority]));
  const groups=f==='done'?[['Completed',sel]]:[['Overdue',sel.filter(t=>t.due&&t.due<td&&t.status!=='done')],['Today',sel.filter(t=>t.due===td)],['Tomorrow',sel.filter(t=>t.due===addD(td,1))],['This week',sel.filter(t=>t.due>addD(td,1)&&t.due<=wk)],['Later',sel.filter(t=>t.due>wk)],['No date',sel.filter(t=>!t.due)],...(f==='all'?[]:[])].filter(g=>g[1].length);
  const chips=[['open','Open',open.length],['today','Today',F.today.length],['upcoming','Upcoming',F.upcoming.length],['overdue','Overdue',F.overdue.length],['done','Done',F.done.length],['all','All',list.length]];
  return head('Tasks','All tasks','Everything you need to do — from every project, in one place.',`<button type="button" class="btn btn-acc" data-a="add" data-t="task">${ic('plus')}New task</button>`)+
  `<section class="card"><form class="inline-add" data-form="quickTask" data-d="" data-p="${esc(pf)}"><input name="t" placeholder="Quick add a task and press Enter…" maxlength="200" aria-label="New task"><button class="btn btn-acc" type="submit">${ic('plus')}Add</button></form>
   <div class="row wrap" style="margin:14px 0 4px;gap:8px"><div class="pillrow grow">${chips.map(([k,l,n])=>`<button type="button" class="chipbtn ${f===k?'on':''}" data-a="taskF" data-v="${k}">${l} <b>${n}</b></button>`).join('')}</div>
   <select data-sel="taskp" style="width:auto;max-width:200px" aria-label="Filter by project"><option value="">All projects</option>${S.projects.map(p=>`<option value="${p.id}" ${pf===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
   <input data-inp="taskq" value="${esc(S.ui.taskq||'')}" placeholder="Search tasks" style="width:180px" aria-label="Search tasks"></div>
   ${groups.map(([g,ts])=>`<div class="tcap" style="color:${g==='Overdue'?'var(--bad)':'var(--acc)'};padding:16px 2px 4px">${g} · ${ts.length}</div><div class="list">${ts.map(t=>taskLi(t)).join('')}</div>`).join('')||empty(f==='done'?'Nothing completed yet':'All clear!','No tasks here. Enjoy the calm — or add one above.','check2')}</section>`};
A.taskF=el=>{S.ui.taskf=el.dataset.v;saveSoon();render()};
document.addEventListener('change',e=>{const s=e.target.closest('[data-sel]');if(s){S.ui[s.dataset.sel]=s.value;saveSoon();render()}});
document.addEventListener('input',e=>{const s=e.target.closest('[data-inp]');if(s){S.ui[s.dataset.inp]=s.value;clearTimeout(s._t);s._t=setTimeout(()=>{const k=s.dataset.inp,pos=s.selectionStart;render();const n=$(`[data-inp="${k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(err){}}},250)}});

/* ---------------- BOARD ---------------- */
const STATUSES=[['todo','To do','#C9A0E8'],['progress','In progress','#D9B26B'],['review','Review','#9CC3F0'],['done','Done','#8FD0A8']];
PAGES['work/board']=()=>{const pf=S.ui.taskp||'';const ts=S.tasks.filter(t=>!pf||t.projectId===pf);
  return head('Kanban','Task board','Drag cards between columns — or use the arrows on a phone.',`<div class="row wrap"><select data-sel="taskp" style="width:auto" aria-label="Filter by project"><option value="">All projects</option>${S.projects.map(p=>`<option value="${p.id}" ${pf===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button type="button" class="btn btn-acc" data-a="add" data-t="task" data-pproject-id="${esc(pf)}">${ic('plus')}New task</button></div>`)+
  `<div class="board">${STATUSES.map(([st,l,c],si)=>{const col=ts.filter(t=>t.status===st);return `<div class="col" data-drop="${st}"><h4><span class="dot" style="background:${c}"></span>${l}<span class="tag">${col.length}</span></h4>
    ${col.map(t=>{const p=projOf(t.projectId),od=t.due&&t.due<today()&&st!=='done';return `<div class="kcard" draggable="true" data-drag="${t.id}"><b>${esc(t.title)}</b><div class="meta">${t.due?`<span class="tag ${od?'bad':''}">${ic('cal',12)}${esc(fDay(t.due))}</span>`:''}<span class="tag pri-${t.priority}">${{high:'High',med:'Medium',low:'Low'}[t.priority]}</span>${p?`<span class="tag" style="color:${esc(p.color)}">${esc(p.name)}</span>`:''}</div>
      <div class="mv">${si>0?`<button type="button" class="icon-btn" data-a="mv" data-id="${t.id}" data-to="${STATUSES[si-1][0]}" aria-label="Move left">${ic('chevL')}</button>`:''}${si<3?`<button type="button" class="icon-btn" data-a="mv" data-id="${t.id}" data-to="${STATUSES[si+1][0]}" aria-label="Move right">${ic('chevR')}</button>`:''}<span class="grow"></span>${acts('task',t.id)}</div></div>`}).join('')}
    <button type="button" class="wadd" data-a="add" data-t="task" data-pstatus="${st}" data-pproject-id="${esc(pf)}">+ Add card</button></div>`}).join('')}</div>`};
AFTER['work/board']=()=>{$$('[data-drag]').forEach(c=>c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'}));
  $$('[data-drop]').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag')});col.addEventListener('dragleave',()=>col.classList.remove('drag'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drag');moveTask(e.dataTransfer.getData('text/plain'),col.dataset.drop)})})};
function moveTask(id,st){const t=S.tasks.find(x=>x.id===id);if(!t||!STATUSES.some(s=>s[0]===st))return;t.status=st;t.doneAt=st==='done'?today():'';commit(st==='done'?'Task done — well done!':'')}
A.mv=el=>moveTask(el.dataset.id,el.dataset.to);

/* ---------------- PROJECTS ---------------- */
PAGES['work/projects']=()=>{const p=projOf(S.ui.proj);if(p)return projectDetail(p);
  return head('Projects','Your projects','Group tasks, goals and meetings. Click a project to open it.',`<button type="button" class="btn btn-acc" data-a="add" data-t="project">${ic('plus')}New project</button>`)+
  (S.projects.length?`<div class="grid g3">${S.projects.map(p=>{const s=projStats(p),left=p.end?until(p.end):null;return `<button type="button" class="card projcard" data-a="openProj" data-id="${p.id}">
     <div class="pc-top"><span class="sw" style="background:${esc(p.color)}"></span><div class="grow"><h3 style="font-size:18px" class="ellip">${esc(p.name)}</h3><small class="muted">${s.done}/${s.total} tasks · ${p.status==='done'?'Completed':p.status==='paused'?'Paused':left===null?'No deadline':left<0?`<span class="bad">${plural(-left,'day')} late</span>`:`${plural(left,'day')} left`}</small></div><b class="gold">${Math.round(s.p)}%</b></div>
     <p class="small muted" style="margin-top:10px;min-height:38px">${esc(String(p.desc||'').slice(0,120))}</p>${bar(s.p)}</button>`}).join('')}</div>`:`<div class="card">${empty('No projects yet','Create one for anything with several steps — a move, a launch, a renovation.','folder')}</div>`)};
function projectDetail(p){const s=projStats(p),ts=S.tasks.filter(t=>t.projectId===p.id),gs=S.goals.filter(g=>g.projectId===p.id),ms=S.meetings.filter(m=>m.projectId===p.id);
  return `<div class="page-head"><div class="ph-t"><button type="button" class="btn btn-sm btn-ghost" data-a="closeProj" style="margin-bottom:8px">${ic('chevL')}All projects</button><div class="kick" style="color:${esc(p.color)}">Project</div><h2>${esc(p.name)}</h2><p>${esc(p.desc||'')}</p></div>
    <div class="row wrap"><button type="button" class="btn" data-a="edit" data-t="project" data-id="${p.id}">${ic('edit')}Edit</button><button type="button" class="btn btn-acc" data-a="add" data-t="task" data-pproject-id="${p.id}">${ic('plus')}Task</button></div></div>
  <div class="grid g4 sts" style="margin-bottom:16px"><div class="card stat"><div class="k">${ic('check2')}Progress</div><div class="v">${Math.round(s.p)}%</div>${bar(s.p)}</div>
    <div class="card stat"><div class="k">${ic('list')}Tasks</div><div class="v">${s.done}/${s.total}</div></div>
    <div class="card stat"><div class="k">${ic('cal')}Dates</div><div class="v" style="font-size:18px">${p.start?esc(fDay(p.start)):'—'} → ${p.end?esc(fDay(p.end)):'—'}</div></div>
    <div class="card stat"><div class="k">${ic('clock')}Time left</div><div class="v">${p.end?(until(p.end)<0?`<span class="bad">${-until(p.end)}d late</span>`:until(p.end)+'d'):'—'}</div></div></div>
  <div class="dash"><section class="card c7"><div class="card-h"><h3>Tasks</h3></div><form class="inline-add" data-form="quickTask" data-d="" data-p="${p.id}"><input name="t" maxlength="200" placeholder="Add a task to this project" aria-label="New task"><button class="btn btn-sm" type="submit">${ic('plus')}</button></form>
     <div class="list" style="margin-top:6px">${ts.sort((a,b)=>(a.status==='done')-(b.status==='done')||(a.due||'9').localeCompare(b.due||'9')).map(t=>taskLi(t)).join('')||empty('No tasks yet','')}</div></section>
   <div class="c5 stack"><section class="card"><div class="card-h"><h3>Goals</h3><button type="button" class="btn btn-sm" data-a="add" data-t="goal" data-pproject-id="${p.id}">${ic('plus')}</button></div>${gs.map(g=>`<div class="li"><div class="t"><b>${esc(g.title)}</b>${bar(goalPct(g))}</div><b class="gold">${Math.round(goalPct(g))}%</b></div>`).join('')||empty('No goals linked','')}</section>
    <section class="card"><div class="card-h"><h3>Meetings</h3><button type="button" class="btn btn-sm" data-a="add" data-t="meeting" data-pproject-id="${p.id}">${ic('plus')}</button></div>${ms.map(m=>`<div class="li"><div class="t"><b>${esc(m.title)}</b><small>${esc(fShort(m.date))}</small></div>${acts('meeting',m.id)}</div>`).join('')||empty('No meetings yet','')}</section>
    <button type="button" class="btn btn-ghost" style="color:var(--bad)" data-a="del" data-t="project" data-id="${p.id}">${ic('trash')}Delete project</button></div></div>`}
A.openProj=el=>{S.ui.proj=el.dataset.id;render();window.scrollTo({top:0,behavior:'auto'})};
A.closeProj=()=>{S.ui.proj=null;render()};

/* ---------------- GOALS ---------------- */
PAGES['work/goals']=()=>{const gs=S.goals.slice().sort((a,b)=>(a.done-b.done)||(a.deadline||'9').localeCompare(b.deadline||'9'));
  return head('Goals','Goals & milestones','Big goals become doable when you break them into small, visible steps.',`<button type="button" class="btn btn-acc" data-a="add" data-t="goal">${ic('plus')}New goal</button>`)+
  (gs.length?`<div class="grid g3">${gs.map(g=>{const p=goalPct(g),left=g.deadline?until(g.deadline):null;return `<article class="card"><div class="card-h"><span class="tag gold">${esc(g.area||'Personal')}</span><span class="grow"></span>${acts('goal',g.id)}</div>
     <div class="row" style="align-items:flex-start;gap:14px"><div class="ring sm" style="--p:${p.toFixed(1)}"><div><b>${Math.round(p)}%</b></div></div><div class="grow"><h3 style="font-size:17px;${g.done?'text-decoration:line-through;opacity:.7':''}" class="brk">${esc(g.title)}</h3>
       <small class="muted">${num(g.target)>0?`${num(g.current)} of ${num(g.target)} ${esc(g.unit||'')}`:''}${left!==null?` · ${left<0?`<span class="bad">${-left}d overdue</span>`:`${left}d left`}`:''}</small>${g.why?`<p class="small muted" style="margin-top:6px">“${esc(g.why)}”</p>`:''}</div></div>
     <div class="list" style="margin-top:10px">${(g.milestones||[]).map(m=>`<div class="li ${m.done?'done':''}" style="padding:7px 2px">${ck(m.done,'msDone',`data-g="${g.id}" data-id="${m.id}"`,true)}<div class="t"><span class="ti" style="font-size:13px">${esc(m.text)}</span></div><button type="button" class="icon-btn" data-a="msDel" data-g="${g.id}" data-id="${m.id}" aria-label="Delete step">${ic('x')}</button></div>`).join('')}</div>
     <form class="inline-add" data-form="milestone" data-g="${g.id}" style="margin-top:8px"><input name="t" maxlength="120" placeholder="Add a step" aria-label="New step"><button class="btn btn-sm" type="submit">${ic('plus')}</button></form>
     <div class="row wrap" style="margin-top:10px">${num(g.target)>0&&!g.done?`<button type="button" class="btn btn-sm" data-a="goalProg" data-id="${g.id}">${ic('trend')}Log progress</button>`:''}<button type="button" class="btn btn-sm ${g.done?'':'btn-acc'}" data-a="goalDone" data-id="${g.id}">${ic('check')}${g.done?'Reopen':'Mark achieved'}</button></div></article>`}).join('')}</div>`:`<div class="card">${empty('No goals yet','What would make this year great? Start with one.','target')}</div>`)};
FORMS.milestone=f=>{const v=f.t.value.trim();if(!v){f.t.focus();return}const g=S.goals.find(x=>x.id===f.dataset.g);if(!g)return;g.milestones=Array.isArray(g.milestones)?g.milestones:[];g.milestones.push({id:uid(),text:v.slice(0,120),done:false});commit('Step added')};
A.msDone=el=>{const g=S.goals.find(x=>x.id===el.dataset.g),m=g&&g.milestones.find(x=>x.id===el.dataset.id);if(m){m.done=!m.done;commit()}};
A.msDel=el=>{const g=S.goals.find(x=>x.id===el.dataset.g);if(g){g.milestones=g.milestones.filter(x=>x.id!==el.dataset.id);commit()}};
A.goalDone=el=>{const g=S.goals.find(x=>x.id===el.dataset.id);if(!g)return;g.done=!g.done;if(g.done&&num(g.target)>0)g.current=num(g.target);commit(g.done?'Goal achieved — congratulations! 🎉':'Goal reopened')};
A.goalProg=el=>{const g=S.goals.find(x=>x.id===el.dataset.id);if(!g)return;form({title:'Log progress · '+g.title,fields:[{k:'add',l:`How much to add (${g.unit||'units'})`,t:'num',req:true,min:0.01,step:'any'}],submit:'Add progress',
  save:v=>{g.current=r2(num(g.current)+num(v.add));if(num(g.target)>0&&g.current>=num(g.target)){g.done=true;return 'Goal achieved — congratulations! 🎉'}return 'Progress saved'}})};

/* ---------------- MATRIX ---------------- */
const QUADS=[['do','Do first','Urgent & important','q1'],['plan','Schedule','Important, not urgent','q2'],['delegate','Delegate','Urgent, not important','q3'],['drop','Drop','Not urgent or important','q4']];
PAGES['work/matrix']=()=>{const open=S.tasks.filter(t=>t.status!=='done'),un=open.filter(t=>!QUADS.some(q=>q[0]===t.matrix));
  return head('Eisenhower matrix','Priority matrix','Sort tasks by urgency and importance. Drag a task into a box, or use the buttons.')+
  `<div class="dash"><div class="c8"><div class="matrix">${QUADS.map(([k,l,d,cls])=>{const ts=open.filter(t=>t.matrix===k);return `<div class="quad ${cls}" data-mdrop="${k}"><h4>${l}<small>${d}</small></h4>
     ${ts.map(t=>`<div class="witem" draggable="true" data-mdrag="${t.id}">${ck(false,'taskDone',`data-id="${t.id}"`)}<span class="grow">${esc(t.title)}</span><button type="button" class="icon-btn" data-a="mtx" data-id="${t.id}" data-v="" aria-label="Remove from box">${ic('x')}</button></div>`).join('')||`<p class="small faint">Nothing here.</p>`}</div>`}).join('')}</div></div>
   <section class="card c4"><div class="card-h"><h3>Not sorted yet</h3><span class="tag">${un.length}</span></div><div class="list">${un.map(t=>`<div class="li" draggable="true" data-mdrag="${t.id}" style="flex-wrap:wrap"><div class="t"><b>${esc(t.title)}</b></div><div class="pillrow">${QUADS.map(([k,l])=>`<button type="button" class="chipbtn" data-a="mtx" data-id="${t.id}" data-v="${k}">${l}</button>`).join('')}</div></div>`).join('')||empty('All sorted!','Every open task has a box.','flag')}</div></section></div>`};
AFTER['work/matrix']=()=>{$$('[data-mdrag]').forEach(c=>c.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',c.dataset.mdrag)));
  $$('[data-mdrop]').forEach(q=>{q.addEventListener('dragover',e=>e.preventDefault());q.addEventListener('drop',e=>{e.preventDefault();const t=S.tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t){t.matrix=q.dataset.mdrop;commit()}})})};
A.mtx=el=>{const t=S.tasks.find(x=>x.id===el.dataset.id);if(t){t.matrix=el.dataset.v;commit()}};

/* ---------------- MEETINGS ---------------- */

  return head('Meetings','Meeting notes','Notes and action items in one place. Turn any action into a task.',`<button type="button" class="btn btn-acc" data-a="add" data-t="meeting">${ic('plus')}New meeting</button>`)+

const ALLOW={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,H2:1,H3:1,P:1,DIV:1,BR:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,MARK:1,A:1,SPAN:1};
function sanitize(html){const t=document.createElement('template');t.innerHTML=String(html||'');
  const walk=node=>{[...node.childNodes].forEach(n=>{if(n.nodeType===3)return;if(n.nodeType!==1){n.remove();return}
    if(!ALLOW[n.tagName]){if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','svg','SVG','IMG','VIDEO','AUDIO','LINK','META','FORM','INPUT','BUTTON','TEXTAREA','SELECT'].includes(n.tagName)){n.remove();return}
      const f=document.createDocumentFragment();while(n.firstChild)f.appendChild(n.firstChild);walk(f);n.replaceWith(f);return}
    [...n.attributes].forEach(a=>{const k=a.name.toLowerCase();const keep=(n.tagName==='A'&&k==='href'&&/^(https?:|mailto:)/i.test(a.value.trim()))||(k==='class'&&((n.tagName==='UL'&&a.value==='todo')||(n.tagName==='LI'&&a.value==='done')));if(!keep)n.removeAttribute(a.name)});
    if(n.tagName==='A'){n.setAttribute('target','_blank');n.setAttribute('rel','noopener noreferrer')}
    walk(n)})};walk(t.content);return t.innerHTML}

     ${nb?`<div style="padding:8px 8px 0"><input data-nq value="${esc(S.ui.nq||'')}" placeholder="Search this notebook" aria-label="Search pages"></div>`:''}
     <div class="nb-list" id="pgList">${nb?(shown.map(p=>pageItem(p,pg)).join('')||`<p class="small faint" style="padding:10px">${q?'No matching pages.':'No pages yet — click + to add one.'}</p>`):`<p class="small faint" style="padding:10px">Create a notebook first.</p>`}</div></div>
   <div class="nb-col eds">${pg?`<div class="ed-wrap"><div class="row" style="padding:10px 14px 0;gap:6px"><button type="button" class="btn btn-sm btn-ghost nb-back" data-a="nbMode" data-v="pages">${ic('chevL')}Pages</button><span class="grow"></span>

     <div class="ed-tools" role="toolbar" aria-label="Formatting">${[['bold','B','Bold'],['italic','<i>I</i>','Italic'],['underline','<u>U</u>','Underline'],['strikeThrough','<s>S</s>','Strikethrough'],['sep'],['h2','H1','Heading'],['h3','H2','Subheading'],['p','¶','Normal text'],['sep'],['ul','•','Bullet list'],['ol','1.','Numbered list'],['todo','☑','Checklist'],['quote','❝','Quote'],['mark','<mark style="padding:0 3px">H</mark>','Highlight'],['sep'],['removeFormat','⌫','Clear formatting']].map(([c,l,t])=>c==='sep'?'<span class="sep"></span>':`<button type="button" data-cmd="${c}" title="${t}" aria-label="${t}">${l}</button>`).join('')}</div>
     <div class="editor" id="editor" contenteditable="true" data-ph="Start writing… use the toolbar for headings, lists and checklists." spellcheck="true">${sanitize(pg.html)}</div></div>`:
     `<div class="empty" style="margin:auto">${ic('note')}<b>${nb?'Pick a page or create a new one':'Create your first notebook'}</b>${nb?'<button type="button" class="btn btn-acc btn-sm" style="margin-top:10px" data-a="newPage">'+ic('plus')+'New page</button>':'<button type="button" class="btn btn-acc btn-sm" style="margin-top:10px" data-a="add" data-t="notebook">'+ic('plus')+'New notebook</button>'}</div>`}</div></div>`};

AFTER['notes/notebooks']=()=>{nbMode='';const ed=$('#editor'),ti=$('#edTitle');const nq=$('[data-nq]');
  if(nq)nq.addEventListener('input',()=>{S.ui.nq=nq.value;const nb=curNb();const q=nq.value.toLowerCase();const pg=S.pages.find(p=>p.id===S.ui.page);$('#pgList').innerHTML=nbPages(nb.id).filter(p=>!q||String(p.title).toLowerCase().includes(q)||stripHTML(p.html).toLowerCase().includes(q)).map(p=>pageItem(p,pg)).join('')||'<p class="small faint" style="padding:10px">No matching pages.</p>'});
  const mv=$('[data-move]');if(mv)mv.addEventListener('change',()=>{const p=S.pages.find(x=>x.id===mv.dataset.move);if(p){p.nb=mv.value;S.ui.nb=mv.value;commit('Page moved')}});
  if(!ed)return;const pg=S.pages.find(p=>p.id===S.ui.page);
  const words=()=>{const n=stripHTML(ed.innerHTML).split(/\s+/).filter(Boolean).length;$('#edWords').textContent=plural(n,'word')};words();
  const store=debounce(()=>{pg.html=sanitize(ed.innerHTML).slice(0,400000);pg.updated=Date.now();S.sample=false;save();$('#edSaved').textContent='Saved';const li=$(`.pgi[data-id="${pg.id}"]`);if(li)li.outerHTML=pageItem(pg,pg)},450);
  ed.addEventListener('input',()=>{$('#edSaved').textContent='Saving…';words();store()});
  ti.addEventListener('input',()=>{pg.title=ti.value.slice(0,120);pg.updated=Date.now();S.sample=false;saveSoon();const li=$(`.pgi[data-id="${pg.id}"] b`);if(li)li.textContent=(pg.pinned?'📌 ':'')+(pg.title||'Untitled page')});
  ti.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ed.focus()}});
  ed.addEventListener('click',e=>{const li=e.target.closest('ul.todo>li');if(li&&e.offsetX<26){li.classList.toggle('done');store()}});
  ed.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)});
  $$('.ed-tools [data-cmd]').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));

    else if(c==='mark'){const sel=window.getSelection().toString();if(sel)document.execCommand('insertHTML',false,`<mark>${esc(sel)}</mark>`)}
    else document.execCommand(c);store()}))};
