/* ================= FINANCE ================= */
const EXP_CATS=['Housing','Groceries','Dining out','Transport','Utilities','Health','Shopping','Entertainment','Subscriptions','Education','Gifts','Travel','Kids','Pets','Personal care','Insurance','Debt payment','Savings','Other'];
const INC_CATS=['Salary','Freelance','Business','Bonus','Gift','Refund','Investment','Other income'];
const expCats=()=>[...new Set([...EXP_CATS,...S.budgets.map(b=>b.cat),...S.transactions.filter(t=>t.type==='expense').map(t=>t.cat)])].filter(Boolean);
const finYm=()=>curYm('finYm');
const txIn=k=>S.transactions.filter(t=>ymOf(t.date)===k);
function monthSum(k){const tx=txIn(k);const inc=sum(tx.filter(t=>t.type==='income'),t=>t.amount),exp=sum(tx.filter(t=>t.type==='expense'),t=>t.amount);return {inc,exp,net:r2(inc-exp),tx}}
const isPaid=(b,k)=>!!(b.paid&&b.paid[k]);
const subMonthly=s=>s.cycle==='yearly'?num(s.amount)/12:s.cycle==='weekly'?num(s.amount)*52/12:num(s.amount);
function subNext(s){if(!isISO(s.start))return '';let d=s.start;const td=today();let guard=0;while(d<td&&guard++<1000){d=s.cycle==='yearly'?addMonthsD(d,12):s.cycle==='weekly'?addD(d,7):addMonthsD(d,1)}return d}
function addMonthsD(s,n){const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+n,1);const dd=Math.min(d,dim(t.getFullYear(),t.getMonth()+1));return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(dd)}`}

SCH.tx={c:'transactions',name:'transaction',label:'note',def:()=>({type:'expense',amount:'',cat:'Groceries',date:today(),note:''}),
  fields:it=>{const type=(it&&it.type)||SCH.tx._type||'expense';return [{k:'type',l:'Type',t:'select',half:true,opts:[['expense','Expense (money out)'],['income','Income (money in)']]},{k:'amount',l:'Amount',t:'money',req:true,half:true},
    {k:'cat',l:'Category',t:'select',half:true,opts:()=>[...new Set([...(type==='income'?INC_CATS:expCats()),...INC_CATS,...expCats()])]},{k:'date',l:'Date',t:'date',req:true,half:true},{k:'note',l:'Description',max:120,ph:'e.g. Weekly shop, Coffee, Salary'}]},
  after:t=>{S.ui.finYm=ymOf(t.date)}};
SCH.budget={c:'budgets',name:'budget',label:'cat',def:()=>({cat:'',limit:''}),add:'end',
  fields:it=>[{k:'cat',l:'Category',t:'select',opts:()=>expCats().filter(c=>!S.budgets.some(b=>b.cat===c&&(!it||b.id!==it.id)))},{k:'limit',l:'Monthly limit',t:'money',req:true}],
  check:(v,it)=>S.budgets.some(b=>b.cat===v.cat&&(!it||b.id!==it.id))?'You already have a budget for this category':null};
SCH.bill={c:'bills',name:'bill',def:()=>({name:'',amount:'',day:1,cat:'Housing',paid:{},notes:''}),add:'end',
  fields:()=>[{k:'name',l:'Bill name',req:true,max:60,ph:'Rent, Phone, Internet…'},{k:'amount',l:'Amount',t:'money',req:true,half:true},{k:'day',l:'Due day of month',t:'num',req:true,min:1,max:31,step:1,half:true,hint:'1–31 · short months use their last day'},
    {k:'cat',l:'Category',t:'select',half:true,opts:()=>expCats()},{k:'notes',l:'Notes',half:true,max:120,ph:'Account no., autopay…'}],
  prep:v=>{v.day=clamp(Math.round(num(v.day,1)),1,31)}};
SCH.paycheck={c:'paychecks',name:'paycheck',label:'source',def:()=>({date:today(),amount:'',source:'Salary',allocs:[]}),
  fields:()=>[{k:'source',l:'From',max:60,half:true,ph:'Salary, Freelance…'},{k:'date',l:'Pay date',t:'date',req:true,half:true},{k:'amount',l:'Amount received',t:'money',req:true}]};
SCH.saving={c:'savings',name:'savings goal',def:()=>({name:'',target:'',saved:0,deadline:'',color:COLORS[2],log:[]}),
  fields:()=>[{k:'name',l:'Saving for',req:true,max:60,ph:'Emergency fund, Holiday, New laptop…'},{k:'target',l:'Target',t:'money',req:true,half:true},{k:'saved',l:'Already saved',t:'money',half:true,pos:false},{k:'deadline',l:'Target date',t:'date',half:true},{k:'color',l:'Colour',t:'color'}]};
SCH.debt={c:'debts',name:'debt',def:()=>({name:'',balance:'',original:'',apr:0,min:'',log:[]}),
  fields:()=>[{k:'name',l:'Debt',req:true,max:60,ph:'Credit card, Car loan…'},{k:'balance',l:'Current balance',t:'money',req:true,half:true},{k:'original',l:'Original amount',t:'money',half:true,pos:false,hint:'Optional — shows your progress'},
    {k:'apr',l:'Interest rate (APR %)',t:'num',min:0,max:100,half:true},{k:'min',l:'Minimum payment / month',t:'money',half:true,pos:false}],
  prep:v=>{v.apr=num(v.apr,0);if(!(num(v.original)>0))v.original=v.balance}};
SCH.sub={c:'subs',name:'subscription',def:()=>({name:'',amount:'',cycle:'monthly',start:today(),cat:'Entertainment',active:true}),add:'end',
  fields:()=>[{k:'name',l:'Service',req:true,max:60,ph:'Netflix, Gym, Cloud storage…'},{k:'amount',l:'Price',t:'money',req:true,half:true},{k:'cycle',l:'Billed',t:'select',half:true,opts:[['monthly','Monthly'],['yearly','Yearly'],['weekly','Weekly']]},
    {k:'start',l:'Next / last charge date',t:'date',req:true,half:true},{k:'cat',l:'Category',t:'select',half:true,opts:()=>expCats()},{k:'active',l:'Active subscription',t:'check'}]};

const finHead=(kick,title,desc,btns='')=>head(kick,title,desc,`<div class="row wrap">${navig('finShift',fYm(finYm()))}${btns}</div>`);
A.finShift=el=>{S.ui.finYm=shiftYm(finYm(),+el.dataset.d);saveSoon();render()};

/* ---------------- OVERVIEW ---------------- */
PAGES['finance/overview']=()=>{const k=finYm(),m=monthSum(k),[y,mm]=k.split('-').map(Number);
  const bills=S.bills.map(b=>({b,paid:isPaid(b,k),day:billDueDay(b,y,mm)})).sort((a,b)=>a.day-b.day);const unpaid=sum(bills.filter(x=>!x.paid),x=>x.b.amount);
  const budget=sum(S.budgets,b=>b.limit),bSpent=sum(S.budgets,b=>sum(m.tx.filter(t=>t.type==='expense'&&t.cat===b.cat),t=>t.amount));
  const byCat={};m.tx.filter(t=>t.type==='expense').forEach(t=>byCat[t.cat]=r2((byCat[t.cat]||0)+t.amount));const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const six=Array.from({length:6},(_,i)=>{const kk=shiftYm(k,i-5);return {kk,...monthSum(kk)}});const mx=Math.max(1,...six.map(x=>Math.max(x.inc,x.exp)));
  const saveRate=m.inc>0?Math.round(m.net/m.inc*100):0;const subsM=sum(S.subs.filter(s=>s.active),subMonthly);
  return finHead('Money overview',esc(fYm(k)),'Your month at a glance: what came in, what went out, and what is still to pay.',addTxBtns)+
  `<div class="grid g4 sts"><div class="card stat"><div class="k">${ic('down')}Money in</div><div class="v good">${money(m.inc)}</div><div class="s">${plural(m.tx.filter(t=>t.type==='income').length,'payment')}</div></div>
    <div class="card stat"><div class="k">${ic('up')}Money out</div><div class="v bad">${money(m.exp)}</div><div class="s">${plural(m.tx.filter(t=>t.type==='expense').length,'expense')}</div></div>
    <div class="card stat"><div class="k">${ic('wallet')}Left over</div><div class="v ${m.net<0?'bad':''}">${money(m.net)}</div><div class="s">${m.inc>0?`Savings rate ${saveRate}%`:'Add income to see your savings rate'}</div></div>
    <div class="card stat"><div class="k">${ic('receipt')}Bills still to pay</div><div class="v">${money(unpaid)}</div><div class="s">${bills.filter(x=>!x.paid).length} of ${bills.length} unpaid</div></div></div>
  <div class="dash" style="margin-top:16px">
   <section class="card c8"><div class="card-h"><h3>Last 6 months</h3><div class="legend"><span><i class="dot" style="background:#8FD0A8"></i>In</span><span><i class="dot" style="background:#E89AAE"></i>Out</span></div></div>
     <div class="cols" style="height:190px">${six.map(x=>`<div class="cc"><div class="pair"><i class="lav" style="height:${(x.inc/mx*100).toFixed(1)}%;background:linear-gradient(180deg,#A8E2BE,#5FAE80)" title="In ${esc(money(x.inc))}"></i><i class="rose" style="height:${(x.exp/mx*100).toFixed(1)}%" title="Out ${esc(money(x.exp))}"></i></div><small>${esc(fMon(...x.kk.split('-').map(Number)))}</small></div>`).join('')}</div></section>
   <section class="card c4"><div class="card-h"><h3>Budget</h3><button type="button" class="btn btn-sm btn-ghost" data-a="pg" data-s="finance" data-p="budget">Open</button></div>
     ${budget>0?`<div class="row" style="gap:16px"><div class="ring" style="--p:${pct(bSpent,budget).toFixed(1)};--c:${bSpent>budget?'var(--bad)':'var(--acc)'}"><div><b>${Math.round(budget?bSpent/budget*100:0)}%</b><small>used</small></div></div><div><div class="small muted">Spent</div><b>${money(bSpent)}</b><div class="small muted" style="margin-top:6px">of ${money(budget)}</div><div class="small ${budget-bSpent<0?'bad':'good'}" style="font-weight:700;margin-top:6px">${budget-bSpent<0?money(bSpent-budget)+' over':money(budget-bSpent)+' left'}</div></div></div>`:empty('No budget yet','Set a monthly limit per category.','pie')}</section>
   <section class="card c6"><div class="card-h"><h3>Spending by category</h3></div>${cats.length?`<div class="hbars">${cats.slice(0,8).map(([c,v])=>`<div class="hr"><span>${esc(c)}</span>${bar(pct(v,cats[0][1]),'lav')}<b class="amt">${money(v)}</b></div>`).join('')}</div>`:empty('No spending this month','')}</section>
   <section class="card c6"><div class="card-h"><h3>Bills this month</h3><button type="button" class="btn btn-sm btn-ghost" data-a="pg" data-s="finance" data-p="bills">Manage</button></div><div class="list">${bills.slice(0,6).map(x=>billLi(x.b,k)).join('')||empty('No bills added','')}</div></section>
   <section class="card c4"><div class="card-h"><h3>Savings</h3></div>${S.savings.slice(0,3).map(s=>`<div style="margin-bottom:12px"><div class="row"><b class="grow ellip">${esc(s.name)}</b><span class="small muted">${Math.round(pct(s.saved,s.target))}%</span></div>${bar(pct(s.saved,s.target),'good')}</div>`).join('')||empty('No savings goals','','star')}</section>
   <section class="card c4"><div class="card-h"><h3>Debt</h3></div>${S.debts.slice(0,3).map(d=>`<div style="margin-bottom:12px"><div class="row"><b class="grow ellip">${esc(d.name)}</b><span class="small muted">${money(d.balance)}</span></div>${bar(pct(num(d.original)-num(d.balance),d.original),'lav')}</div>`).join('')||empty('Debt-free!','','trend')}</section>
   <section class="card c4"><div class="card-h"><h3>Subscriptions</h3></div><div class="v count">${money(subsM)}</div><div class="small muted">per month · ${money(subsM*12)} a year · ${S.subs.filter(s=>s.active).length} active</div></section>
  </div>`};

/* ---------------- BUDGET ---------------- */
PAGES['finance/budget']=()=>{const k=finYm(),m=monthSum(k);const spentOf=c=>sum(m.tx.filter(t=>t.type==='expense'&&t.cat===c),t=>t.amount);
  const total=sum(S.budgets,b=>b.limit),spent=sum(S.budgets,b=>spentOf(b.cat));const others=[...new Set(m.tx.filter(t=>t.type==='expense'&&!S.budgets.some(b=>b.cat===t.cat)).map(t=>t.cat))];
  return finHead('Budget','Monthly budget','Give each category a monthly limit. Spending is counted automatically from your transactions.',`<button type="button" class="btn btn-acc btn-sm" data-a="add" data-t="budget">${ic('plus')}Category budget</button>`)+
  `<div class="grid g3 sts"><div class="card stat"><div class="k">${ic('pie')}Total budget</div><div class="v">${money(total)}</div></div><div class="card stat"><div class="k">${ic('up')}Spent</div><div class="v">${money(spent)}</div>${bar(pct(spent,total),spent>total?'over':'')}</div>
   <div class="card stat"><div class="k">${ic('wallet')}Remaining</div><div class="v ${total-spent<0?'bad':'good'}">${money(total-spent)}</div><div class="s">${m.inc>0?`Income this month ${money(m.inc)}`:''}</div></div></div>
  <section class="card" style="margin-top:16px"><div class="card-h"><h3>Categories</h3></div><div class="list">${S.budgets.map(b=>{const s=spentOf(b.cat),l=num(b.limit),over=s>l;return `<div class="li" style="flex-wrap:wrap"><div class="t" style="min-width:180px"><b>${esc(b.cat)}</b><small>${money(s)} of ${money(l)} · <span class="${over?'bad':'good'}" style="font-weight:700">${over?money(s-l)+' over':money(l-s)+' left'}</span></small>${bar(pct(s,l),over?'over':'')}</div><b class="amt" style="width:52px;text-align:right">${Math.round(l?s/l*100:0)}%</b>${acts('budget',b.id)}</div>`}).join('')||empty('No category budgets yet','Start with your biggest categories: housing, groceries, transport.','pie')}</div></section>
  ${others.length?`<section class="card" style="margin-top:16px"><div class="card-h"><h3>Spending without a budget</h3></div><div class="list">${others.map(c=>`<div class="li"><div class="t"><b>${esc(c)}</b><small>${money(spentOf(c))} spent this month</small></div><button type="button" class="btn btn-sm" data-a="add" data-t="budget" data-pcat="${esc(c)}">${ic('plus')}Set budget</button></div>`).join('')}</div></section>`:''}`};

PAGES['finance/transactions']=()=>{const k=finYm(),m=monthSum(k),f=S.ui.txf||'all',q=(S.ui.txq||'').toLowerCase();
  const list=m.tx.filter(t=>(f==='all'||t.type===f)&&(!q||String(t.note).toLowerCase().includes(q)||String(t.cat).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||num(b.created)-num(a.created));

  <section class="card" style="margin-top:16px"><div class="row wrap" style="margin-bottom:8px"><div class="seg">${[['all','All'],['income','Income'],['expense','Expenses']].map(([v,l])=>`<button type="button" class="${f===v?'on':''}" data-a="txF" data-v="${v}">${l}</button>`).join('')}</div><span class="grow"></span><input data-inp="txq" value="${esc(S.ui.txq||'')}" placeholder="Search" style="width:200px" aria-label="Search transactions"><button type="button" class="btn btn-sm" data-a="csv">${ic('download')}CSV</button></div>
   <div class="tbl-wrap"><table class="tbl stack-m"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="right">Amount</th><th></th></tr></thead><tbody>
   ${list.map(t=>`<tr><td class="nowrap muted">${esc(fShort(t.date))}</td><td class="brk"><b>${esc(t.note||t.cat)}</b></td><td><span class="tag ${t.type==='income'?'good':''}">${esc(t.cat)}</span></td><td class="right"><span class="amt ${t.type==='income'?'pos':'neg'}">${t.type==='income'?'+':'−'}${money(t.amount)}</span></td><td class="right">${acts('tx',t.id)}</td></tr>`).join('')}</tbody></table></div>
   ${list.length?'':empty('No transactions','Nothing for this month'+(q||f!=='all'?' with this filter':'')+'.','list')}</section>`};

function billLi(b,k){const[y,m]=k.split('-').map(Number),day=billDueDay(b,y,m),d=`${k}-${pad(day)}`,paid=isPaid(b,k),td=today();
  const st=paid?'<span class="tag good">Paid</span>':d<td?'<span class="tag bad">Overdue</span>':d===td?'<span class="tag warn">Due today</span>':`<span class="tag">Due ${esc(fDay(d))}</span>`;
  return `<div class="li ${paid?'done':''}">${ck(paid,'billPaid',`data-id="${b.id}" data-k="${k}"`,true)}<div class="t"><b>${esc(b.name)}</b><small>${st} · ${esc(b.cat||'')}${b.notes?' · '+esc(b.notes):''}</small></div><span class="amt">${money(b.amount)}</span>${acts('bill',b.id)}</div>`}
PAGES['finance/bills']=()=>{const k=finYm(),[y,m]=k.split('-').map(Number);const bs=S.bills.slice().sort((a,b)=>billDueDay(a,y,m)-billDueDay(b,y,m));
  const tot=sum(bs,b=>b.amount),paid=sum(bs.filter(b=>isPaid(b,k)),b=>b.amount);
  return finHead('Bills','Bill tracker','Bills repeat every month. Tick them off — paid bills are added to your expenses automatically.',`<button type="button" class="btn btn-acc btn-sm" data-a="add" data-t="bill">${ic('plus')}Bill</button>`)+
  `<div class="grid g3 sts"><div class="card stat"><div class="k">${ic('receipt')}Total this month</div><div class="v">${money(tot)}</div></div><div class="card stat"><div class="k">${ic('check2')}Paid</div><div class="v good">${money(paid)}</div>${bar(pct(paid,tot),'good')}</div><div class="card stat"><div class="k">${ic('clock')}Still to pay</div><div class="v ${tot-paid>0?'warn':''}">${money(tot-paid)}</div></div></div>
  <section class="card" style="margin-top:16px"><div class="list">${bs.map(b=>billLi(b,k)).join('')||empty('No bills yet','Add rent, phone, internet, insurance — anything that repeats monthly.','receipt')}</div></section>`};
A.billPaid=el=>{const b=S.bills.find(x=>x.id===el.dataset.id),k=el.dataset.k;if(!b)return;b.paid=b.paid&&typeof b.paid==='object'?b.paid:{};
  if(b.paid[k]){delete b.paid[k];S.transactions=S.transactions.filter(t=>!(t.billId===b.id&&t.billYm===k));commit(b.name+' marked unpaid')}
  else{b.paid[k]=true;const[y,m]=k.split('-').map(Number);S.transactions.push({id:uid(),type:'expense',amount:r2(b.amount),cat:b.cat||'Housing',date:`${k}-${pad(billDueDay(b,y,m))}`,note:b.name,billId:b.id,billYm:k,created:Date.now()});commit(b.name+' paid — added to expenses')}};

FORMS.alloc=f=>{const l=f.l.value.trim(),a=parseAmt(f.a.value);if(!l){f.l.focus();toast('Please name the pot',true);return}if(!(a>0)){f.a.focus();toast('Please enter a valid amount',true);return}const p=S.paychecks.find(x=>x.id===f.dataset.p);if(!p)return;p.allocs=Array.isArray(p.allocs)?p.allocs:[];p.allocs.push({id:uid(),label:l.slice(0,40),amount:a});commit('Pot added')};
A.allocDel=el=>{const p=S.paychecks.find(x=>x.id===el.dataset.p);if(p){p.allocs=p.allocs.filter(a=>a.id!==el.dataset.id);commit()}};

/* ---------------- SAVINGS ---------------- */
PAGES['finance/savings']=()=>{const tot=sum(S.savings,s=>s.saved),tg=sum(S.savings,s=>s.target);
  return head('Savings','Savings goals','Watch every goal fill up. Add money whenever you can — small amounts add up.',`<button type="button" class="btn btn-acc" data-a="add" data-t="saving">${ic('plus')}Savings goal</button>`)+
  `<div class="grid g3 sts" style="margin-bottom:16px"><div class="card stat"><div class="k">${ic('star')}Total saved</div><div class="v good">${money(tot)}</div></div><div class="card stat"><div class="k">${ic('target')}Total targets</div><div class="v">${money(tg)}</div>${bar(pct(tot,tg),'good')}</div><div class="card stat"><div class="k">${ic('check2')}Goals reached</div><div class="v">${S.savings.filter(s=>num(s.saved)>=num(s.target)&&num(s.target)>0).length}/${S.savings.length}</div></div></div>`+
  (S.savings.length?`<div class="grid g3">${S.savings.map(s=>{const p=pct(s.saved,s.target),left=r2(num(s.target)-num(s.saved));let per='';if(s.deadline&&left>0){const mths=Math.max(1,Math.ceil(until(s.deadline)/30.44));per=until(s.deadline)<0?'<span class="bad">Target date passed</span>':`Save ${money(left/mths)} a month to make it`}
    return `<article class="card"><div class="card-h"><span class="dot" style="background:${esc(s.color)}"></span><h3 class="ellip">${esc(s.name)}</h3>${acts('saving',s.id)}</div>
    <div class="row" style="gap:16px"><div class="ring" style="--p:${p.toFixed(1)};--c:${esc(s.color)}"><div><b>${Math.round(p)}%</b><small>saved</small></div></div><div class="grow"><div class="count" style="font-size:24px">${money(s.saved)}</div><div class="small muted">of ${money(s.target)}${s.deadline?' · by '+esc(fDay(s.deadline)):''}</div><div class="small" style="margin-top:6px">${left<=0?'<span class="good" style="font-weight:700">Goal reached! 🎉</span>':per}</div></div></div>
    <div class="row" style="margin-top:12px"><button type="button" class="btn btn-sm btn-acc" data-a="savMove" data-id="${s.id}" data-d="1">${ic('plus')}Add money</button><button type="button" class="btn btn-sm" data-a="savMove" data-id="${s.id}" data-d="-1" ${num(s.saved)>0?'':'disabled'}>${ic('minus')}Withdraw</button></div></article>`}).join('')}</div>`:`<div class="card">${empty('No savings goals yet','An emergency fund is a great first goal.','star')}</div>`)};
A.savMove=el=>{const s=S.savings.find(x=>x.id===el.dataset.id),d=+el.dataset.d;if(!s)return;
  form({title:(d>0?'Add money to ':'Withdraw from ')+s.name,fields:[{k:'amount',l:'Amount',t:'money',req:true},{k:'date',l:'Date',t:'date',req:true,def:today()}],submit:d>0?'Add money':'Withdraw',
    save:v=>{if(d<0&&v.amount>num(s.saved)+0.004){toast('Only '+money(s.saved)+' is saved here',true);return false}const was=num(s.saved)<num(s.target);s.saved=r2(num(s.saved)+d*v.amount);s.log=Array.isArray(s.log)?s.log:[];s.log.push({id:uid(),date:v.date,amount:d*v.amount});
      return d>0?(was&&s.saved>=num(s.target)?'Goal reached — amazing! 🎉':money(v.amount)+' added'):money(v.amount)+' withdrawn'}})};

/* ---------------- DEBTS ---------------- */
function payoffMonths(d){const b=num(d.balance),r=num(d.apr)/1200,p=num(d.min);if(b<=0)return 0;if(p<=0)return null;if(r===0)return Math.ceil(b/p);if(p<=b*r)return Infinity;return Math.ceil(-Math.log(1-r*b/p)/Math.log(1+r))}
PAGES['finance/debts']=()=>{const ds2=S.debts.slice().sort((a,b)=>num(a.balance)-num(b.balance));const tot=sum(ds2,d=>d.balance),orig=sum(ds2,d=>d.original),mins=sum(ds2.filter(d=>num(d.balance)>0),d=>d.min);
  return head('Debt payoff','Debt snowball','Pay the minimum on everything, then throw every extra at the smallest balance first.',`<button type="button" class="btn btn-acc" data-a="add" data-t="debt">${ic('plus')}Debt</button>`)+
  `<div class="grid g3 sts" style="margin-bottom:16px"><div class="card stat"><div class="k">${ic('trend')}Total owed</div><div class="v">${money(tot)}</div></div><div class="card stat"><div class="k">${ic('check2')}Paid off so far</div><div class="v good">${money(Math.max(0,orig-tot))}</div>${bar(pct(orig-tot,orig),'good')}</div><div class="card stat"><div class="k">${ic('cal')}Minimums / month</div><div class="v">${money(mins)}</div></div></div>`+
  (ds2.length?`<section class="card"><div class="list">${ds2.map((d,i)=>{const n=payoffMonths(d),done=num(d.balance)<=0;return `<div class="li" style="flex-wrap:wrap"><span class="tag ${done?'good':i===ds2.findIndex(x=>num(x.balance)>0)?'gold':''}">${done?'Paid off':'#'+(i+1)}</span><div class="t" style="min-width:200px"><b>${esc(d.name)}</b><small>${num(d.apr)}% APR · min ${money(d.min)} · ${done?'Done! 🎉':n===null?'Add a minimum payment to estimate':n===Infinity?'<span class="bad">Minimum does not cover the interest</span>':`about ${plural(n,'month')} at the minimum`}</small>${bar(pct(num(d.original)-num(d.balance),d.original),'good')}</div><span class="amt">${money(d.balance)}</span>${done?'':`<button type="button" class="btn btn-sm" data-a="debtPay" data-id="${d.id}">Log payment</button>`}${acts('debt',d.id)}</div>`}).join('')}</div></section>`:`<div class="card">${empty('No debts listed','Only add debts if you want to track them.','trend')}</div>`)};
A.debtPay=el=>{const d=S.debts.find(x=>x.id===el.dataset.id);if(!d)return;
  form({title:'Payment · '+d.name,fields:[{k:'amount',l:'Payment amount',t:'money',req:true,half:true},{k:'date',l:'Date',t:'date',req:true,half:true,def:today()},{k:'exp',l:'Also add it to my expenses',t:'check',def:true}],submit:'Log payment',
    save:v=>{if(v.amount>num(d.balance)+0.004){toast('The balance is only '+money(d.balance),true);return false}d.balance=r2(Math.max(0,num(d.balance)-v.amount));d.log=Array.isArray(d.log)?d.log:[];d.log.push({id:uid(),date:v.date,amount:v.amount});
      if(v.exp)S.transactions.push({id:uid(),type:'expense',amount:v.amount,cat:'Debt payment',date:v.date,note:d.name,created:Date.now()});return d.balance<=0?d.name+' is paid off! 🎉':'Payment logged'}})};

A.habit=el=>{const d=el.dataset.d,id=el.dataset.id;if(d>today()){toast('You can only tick today or earlier',true);return}S.habitLog[d]=S.habitLog[d]&&typeof S.habitLog[d]==='object'?S.habitLog[d]:{};

PAGES['wellness/habits']=()=>{const k=curYm('habYm'),[y,m]=k.split('-').map(Number),n=dim(y,m),td=today();const days=Array.from({length:n},(_,i)=>`${k}-${pad(i+1)}`);

  `<div class="grid g3 sts" style="margin-bottom:16px"><div class="card stat"><div class="k">${ic('check2')}Done today</div><div class="v">${doneToday}/${S.habits.length}</div>${bar(pct(doneToday,S.habits.length),'good')}</div>
    <div class="card stat"><div class="k">${ic('fire')}Best current streak</div><div class="v">${plural(Math.max(0,...S.habits.map(h=>streak(h.id))),'day')}</div></div>
    <div class="card stat"><div class="k">${ic('cal')}This month</div><div class="v">${Math.round(pct(sum(S.habits,h=>days.filter(d=>d<=td&&hDone(d,h.id)).length),S.habits.length*days.filter(d=>d<=td).length))}%</div><div class="s">of all habit check-ins</div></div></div>

   ${S.habits.map(h=>{const wkDone=wk.filter(d=>hDone(d,h.id)).length;return `<tr><td class="hn" title="${esc(h.name)}"><span class="dot" style="background:${esc(h.color)}"></span> ${esc(h.name)} <button type="button" class="icon-btn" style="width:24px;height:24px;display:inline-grid;vertical-align:middle" data-a="edit" data-t="habit" data-id="${h.id}" aria-label="Edit habit">${ic('edit',13)}</button></td>${days.map(d=>`<td><button type="button" class="hcell ${hDone(d,h.id)?'on':''} ${d===td?'td':''} ${d>td?'fut':''}" style="--c:${esc(h.color)}" data-a="habit" data-d="${d}" data-id="${h.id}" aria-label="${esc(h.name)} on ${esc(fDay(d))}${hDone(d,h.id)?' — done':''}" ${d>td?'disabled':''}></button></td>`).join('')}<td><span class="tag ${wkDone>=num(h.goal,7)?'good':''}">${wkDone}/${num(h.goal,7)}</span></td></tr>`}).join('')}</tbody></table></div></section>`:''}`};
A.habShift=el=>{S.ui.habYm=shiftYm(curYm('habYm'),+el.dataset.d);saveSoon();render()};

PAGES['wellness/mood']=()=>{const k=curYm('moodYm'),[y,m]=k.split('-').map(Number),n=dim(y,m),td=today(),start=weekStartOf(`${k}-01`);

  const cnt=[1,2,3,4,5].map(v=>vals.filter(x=>x===v).length);

     <div class="small muted" style="margin:14px 0 6px">A word about today (optional)</div><textarea rows="3" data-moodnote="${td}" placeholder="What shaped your mood?" aria-label="Mood note">${esc((S.journal[td]&&S.journal[td].moodNote)||'')}</textarea>

   <section class="card c7"><div class="card-h"><h3>${esc(fYm(k))}</h3></div><div class="heat">${cells}</div>

PAGES['wellness/selfcare']=()=>{const td=today(),log=S.selfcareLog[td]||{};const done=S.selfcare.filter(s=>log[s.id]).length;

   <section class="card c4"><div class="card-h"><h3>Need an idea?</h3></div><div class="list">${['Take a 10-minute walk outside','Drink a glass of water slowly','Stretch for five minutes','Text someone you love','Tidy one small surface','Put your phone away for an hour','Take a warm shower or bath','Listen to a favourite song','Write three things that went well','Go to bed 30 minutes earlier'].filter(x=>!S.selfcare.some(s=>s.text===x)).slice(0,6).map(x=>`<div class="li"><div class="t"><span class="ti" style="font-weight:500">${esc(x)}</span></div><button type="button" class="btn btn-sm" data-a="scAdd" data-v="${esc(x)}">${ic('plus')}</button></div>`).join('')}</div></section></div>`};

PAGES['wellness/gratitude']=()=>{const list=S.gratitude.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||num(b.created)-num(a.created));

  ${MEALS.map(([k,l])=>`<tr><td><b>${l}</b></td>${days.map(d=>`<td style="padding:6px"><input data-meal="${d}" data-m="${k}" list="recipeList" maxlength="80" value="${esc((S.meals[d]&&S.meals[d][k])||'')}" placeholder="—" aria-label="${l} on ${esc(fShort(d))}" style="padding:8px"></td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
  <div class="grid g2" style="margin-top:16px"><section class="card"><div class="card-h"><h3>Shopping for this week</h3></div><p class="small muted" style="margin-bottom:10px">Planned a saved recipe? Add its ingredients to your grocery list in one click.</p>
     <div class="list">${[...new Set(days.flatMap(d=>MEALS.map(([k])=>S.meals[d]&&S.meals[d][k]).filter(Boolean)))].map(name=>{const r=S.recipes.find(x=>x.name.toLowerCase()===String(name).toLowerCase());return r?`<div class="li"><div class="t"><b>${esc(r.name)}</b><small>${plural(lines(r.ingredients).length,'ingredient')}</small></div><button type="button" class="btn btn-sm" data-a="recGro" data-id="${r.id}">${ic('cart')}Add to list</button></div>`:''}).join('')||empty('No saved recipes planned','Save recipes to plan with them.','cup')}</div></section>
   <section class="card"><div class="card-h"><h3>Meal ideas</h3></div><div class="pillrow">${['Overnight oats','Veggie stir-fry','Chicken wraps','Lentil soup','Pasta bake','Salmon & rice','Omelette','Chili','Buddha bowl','Homemade pizza'].map(x=>`<span class="tag">${x}</span>`).join('')}</div></section></div>`};

PAGES['life/recipes']=()=>{const f=S.ui.recf||'All';const list=S.recipes.filter(r=>f==='All'||(f==='Favourites'?r.fav:r.cat===f)).sort((a,b)=>(!!b.fav-!!a.fav)||String(a.name).localeCompare(String(b.name)));

  `<div class="pillrow" style="margin-bottom:14px">${['All','Favourites','Breakfast','Lunch','Dinner','Snack','Dessert','Drink'].map(c=>`<button type="button" class="chipbtn ${f===c?'on':''}" data-a="recF" data-v="${c}">${c}</button>`).join('')}</div>`+
  (list.length?`<div class="grid g3">${list.map(r=>`<article class="card"><div class="card-h"><h3 class="brk">${r.fav?'⭐ ':''}${esc(r.name)}</h3>${acts('recipe',r.id)}<div class="sub">${esc(r.cat)}${num(r.time)?` · ${num(r.time)} min`:''}${num(r.serves)?` · serves ${num(r.serves)}`:''}</div></div>
     <ul style="padding-left:18px;font-size:13px;color:var(--body)">${lines(r.ingredients).slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('')}${lines(r.ingredients).length>6?`<li class="muted">+${lines(r.ingredients).length-6} more</li>`:''}</ul>

A.recF=el=>{S.ui.recf=el.dataset.v;render()};
A.recView=el=>{const r=S.recipes.find(x=>x.id===el.dataset.id);if(!r)return;openModal(r.name,`<p class="muted small" style="margin-bottom:12px">${esc(r.cat)}${num(r.time)?` · ${num(r.time)} min`:''}${num(r.serves)?` · serves ${num(r.serves)}`:''}</p><h4 style="margin-bottom:6px">Ingredients</h4><ul style="padding-left:20px;margin-bottom:14px">${lines(r.ingredients).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="muted">None added</li>'}</ul><h4 style="margin-bottom:6px">Method</h4><p style="white-space:pre-wrap" class="brk">${esc(r.steps||'—')}</p>`,`<button type="button" class="btn" data-a="mclose">Close</button><button type="button" class="btn btn-acc" data-a="recGro" data-id="${r.id}">${ic('cart')}Add to groceries</button>`,{wide:true,noFocus:true})};
A.recGro=el=>{const r=S.recipes.find(x=>x.id===el.dataset.id);if(!r)return;let n=0;lines(r.ingredients).forEach(x=>{if(!S.groceries.some(g=>!g.done&&g.text.toLowerCase()===x.toLowerCase())){S.groceries.push({id:uid(),text:x.slice(0,80),qty:'',cat:guessAisle(x),done:false});n++}});closeModal();commit(n?`${plural(n,'item')} added to groceries`:'Already on your list')};

const AISLES=['Produce','Dairy & eggs','Bakery','Meat & fish','Pantry','Frozen','Drinks','Household','Personal care','Other'];
function guessAisle(t){t=t.toLowerCase();const m=[['Produce',/apple|banana|berr|lettuce|tomato|onion|garlic|potato|carrot|spinach|lemon|lime|pepper|cucumber|fruit|veg|avocado|herb|mushroom|ginger/],['Dairy & eggs',/milk|cheese|yog|butter|cream|egg/],['Bakery',/bread|bagel|bun|tortilla|wrap|croissant/],['Meat & fish',/chicken|beef|pork|fish|salmon|tuna|turkey|mince|bacon|shrimp/],['Frozen',/frozen|ice cream|peas/],['Drinks',/juice|coffee|tea|water|soda|wine|beer/],['Household',/soap|detergent|paper|foil|bin bag|sponge|clean/],['Personal care',/shampoo|toothpaste|deodorant|razor|lotion/],['Pantry',/rice|pasta|flour|sugar|oil|salt|oat|bean|lentil|sauce|spice|honey|cereal|nut|can/]];for(const[a,r]of m)if(r.test(t))return a;return 'Other'}

  fields:()=>[{k:'text',l:'Item',req:true,max:80},{k:'qty',l:'Quantity',half:true,max:20,ph:'2, 1 kg…'},{k:'cat',l:'Aisle',t:'select',half:true,opts:AISLES}]};
PAGES['life/groceries']=()=>{const open=S.groceries.filter(g=>!g.done),done=S.groceries.filter(g=>g.done);

  <div class="grid g3">${AISLES.map(a=>{const its=open.filter(g=>(AISLES.includes(g.cat)?g.cat:'Other')===a);return its.length?`<section class="card"><div class="card-h"><h3>${a}</h3><span class="tag">${its.length}</span></div><div class="list">${its.map(g=>`<div class="li">${ck(false,'toggle',`data-c="groceries" data-id="${g.id}"`,true)}<div class="t"><span class="ti">${esc(g.text)}</span>${g.qty?`<small>${esc(g.qty)}</small>`:''}</div>${acts('grocery',g.id)}</div>`).join('')}</div></section>`:''}).join('')}</div>
  ${!open.length?`<div class="card">${empty('List is empty','Add items above, or send a recipe’s ingredients here.','cart')}</div>`:''}

FORMS.gro=f=>{const v=f.t.value.trim();if(!v){f.t.focus();return}S.groceries.push({id:uid(),text:v.slice(0,80),qty:f.q.value.trim().slice(0,20),cat:guessAisle(v),done:false});commit('Added');setTimeout(()=>{const n=$('[data-form="gro"] input');n&&n.focus()},20)};

  fields:()=>[{k:'title',l:'Title',req:true,max:100},{k:'author',l:'Author',half:true,max:60},{k:'status',l:'Shelf',t:'select',half:true,opts:[['want','Want to read'],['reading','Reading now'],['done','Finished']]},

  prep:v=>{v.pages=v.pages===''?'':Math.round(num(v.pages));v.read=Math.round(num(v.read));if(num(v.pages)>0)v.read=Math.min(v.read,num(v.pages));if(v.status==='done'){v.finished=v.finished||today();if(num(v.pages)>0)v.read=num(v.pages)}}};
PAGES['life/reading']=()=>{const y=today().slice(0,4),goal=num(S.settings.readGoal,12),doneY=S.books.filter(b=>b.status==='done'&&String(b.finished||'').startsWith(y)).length;
  const shelf=(st,t)=>{const bs=S.books.filter(b=>b.status===st);return `<section class="card"><div class="card-h"><h3>${t}</h3><span class="tag">${bs.length}</span></div><div class="list">${bs.map(b=>{const c=COLORS[Math.abs([...String(b.title)].reduce((a,ch)=>a+ch.charCodeAt(0),0))%COLORS.length];return `<div class="li"><div class="cover" style="background:${c}">${esc(String(b.title).slice(0,1).toUpperCase())}</div><div class="t"><b>${esc(b.title)}</b><small>${esc(b.author||'')}${num(b.rating)?' · <span class="gold">'+stars(b.rating)+'</span>':''}</small>${st==='reading'&&num(b.pages)>0?`${bar(pct(b.read,b.pages),'lav')}<small>${num(b.read)} / ${num(b.pages)} pages</small>`:''}</div>${acts('book',b.id)}</div>`}).join('')||empty('Empty shelf','')}</div></section>`};

  `<div class="grid g3 sts" style="margin-bottom:16px"><div class="card stat"><div class="k">${ic('book2')}Read in ${y}</div><div class="v">${doneY}/${goal}</div>${bar(pct(doneY,goal),'lav')}<form data-form="readGoal" class="row" style="margin-top:10px"><label class="small muted" for="rg">Yearly goal</label><input id="rg" name="g" type="number" min="1" max="500" value="${goal}" style="width:80px"><button class="btn btn-sm" type="submit">Save</button></form></div>

     ${budget?`<div class="small muted" style="margin-top:10px">Budget used · ${Math.round(budget?sum(S.budgets,b=>sum(m.tx.filter(t=>t.type==='expense'&&t.cat===b.cat),t=>t.amount))/budget*100:0)}%</div>${bar(pct(sum(S.budgets,b=>sum(m.tx.filter(t=>t.type==='expense'&&t.cat===b.cat),t=>t.amount)),budget))}`:''}

AFTER.home=()=>{bindTop();tickClock()};
FORMS.capture=f=>{const k=f.k.value,v=f.t.value.trim();if(!v&&k!=='expense'){f.t.focus();return}const td=today();
  if(k==='task'){S.tasks.unshift({id:uid(),title:v.slice(0,200),notes:'',due:td,time:'',priority:'med',status:'todo',projectId:'',matrix:'',created:Date.now()});commit('Task added for today')}
  else if(k==='note'){S.quick.unshift({id:uid(),text:v.slice(0,2000),color:0,ts:Date.now()});commit('Note saved')}
  else if(k==='event')editItem('event',null,{title:v.slice(0,120),date:td});
  else{const m=v.match(/(\d+(?:[.,]\d{1,2})?)/);const amt=m?parseAmt(m[1]):'';SCH.tx._type='expense';editItem('tx',null,{type:'expense',amount:amt>0?amt:'',note:v.replace(m?m[1]:'','').trim().slice(0,120),cat:'Other',date:td});SCH.tx._type=null}};
A.addTxH=el=>{SCH.tx._type=el.dataset.k;editItem('tx',null,{type:el.dataset.k,cat:el.dataset.k==='income'?'Salary':'Groceries',date:today()});SCH.tx._type=null};
A.jGo=()=>{S.ui.jday=today();go('notes','journal')};
A.openPage=el=>{const p=S.pages.find(x=>x.id===el.dataset.id);if(!p)return;S.ui.nb=p.nb;S.ui.page=p.id;nbMode='editor';go('notes','notebooks')};
A.startFresh=()=>confirmBox('Start fresh? All the <b>sample data</b> will be removed so you can add your own. Your name, theme and currency stay.','Start fresh',()=>{const keep={...S.settings};S=blank();S.settings=keep;S.sample=false;save();go('home');toast('Clean slate — let\u2019s plan your life ✨')},false);
A.focusJump=()=>{if(S.ui.sec!=='home')go('home');setTimeout(()=>{const c=$('#focusCard');c&&c.scrollIntoView({block:'center',behavior:'smooth'})},50)};
function tickClock(){const c=$('#clockV');if(c)c.innerHTML=esc(dtf({hour:'numeric',minute:'2-digit'}).format(new Date()));const g=$('#greetH');if(g){const n=S.settings.name;g.innerHTML=`${greet()}${n?`, <em>${esc(n)}</em>`:''}.`}}
let lastDay=today();setInterval(()=>{tickClock();if(today()!==lastDay){lastDay=today();if(!$('#mback').classList.contains('on')&&!document.activeElement.matches('input,textarea,[contenteditable=true]'))render()}},15000);
/* focus timer */
function timerTick(){if(timer.end){const left=Math.max(0,Math.round((timer.end-Date.now())/1000));timer.left=left;if(left<=0){timer.end=null;timer.left=null;
    if(timer.mode==='focus'){const td=today();S.focus[td]=num(S.focus[td])+1;save();toast('Focus session done — take a short break ☕');timer.mode='break'}else{toast('Break over — ready for the next round?');timer.mode='focus'}beep();if(S.ui.sec==='home')render()}}
  const v=$('#timerV');if(v)v.textContent=fmtT(tSecs());const b=$('#timerBtn');if(b)b.innerHTML=timer.end?ic('pause')+'Pause':ic('play')+'Start';const md=$('#timerMode');if(md)md.textContent=timer.mode==='focus'?'Focus':'Break';
  document.title=timer.end?`${fmtT(tSecs())} · ${timer.mode==='focus'?'Focus':'Break'} — All-in-One Digital Planner`:document.title.replace(/^\d\d:\d\d · (Focus|Break) — All-in-One Digital Planner$/,'All-in-One Digital Planner')}
setInterval(timerTick,1000);
A.timerGo=()=>{if(timer.end){timer.left=Math.max(0,Math.round((timer.end-Date.now())/1000));timer.end=null}else{timer.end=Date.now()+tSecs()*1000}timerTick()};
A.timerReset=()=>{timer.end=null;timer.left=null;timerTick()};
A.timerSwap=()=>{timer.mode=timer.mode==='focus'?'break':'focus';timer.end=null;timer.left=null;render()};
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.2,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.6);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.65)}catch(e){}}

FORMS.settings=f=>{const st=S.settings;st.name=f.name.value.trim().slice(0,40);st.theme=f.theme.value==='light'?'light':'dark';st.currency=CURRENCIES.some(c=>c[0]===f.currency.value)?f.currency.value:'USD';fmC={};
  st.weekStart=f.weekStart.value==='0'?0:1;st.waterGoal=clamp(Math.round(num(f.waterGoal.value,8)),1,20);st.sleepGoal=clamp(num(f.sleepGoal.value,8),3,14);st.readGoal=clamp(Math.round(num(f.readGoal.value,12)),1,500);
